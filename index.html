<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bütçem — Kişisel Finans Takibi</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#16213a; --text:#e2e8f0;
    --muted:#94a3b8; --primary:#22c55e; --primary-dark:#16a34a;
    --danger:#ef4444; --warn:#f59e0b; --info:#38bdf8; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:linear-gradient(135deg,#0f172a,#1e293b);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:860px;margin:0 auto}
  h1{text-align:center;font-size:1.6rem;margin:8px 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .card h2{font-size:1.05rem;margin-bottom:12px;border-bottom:1px solid #334155;padding-bottom:8px}
  label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:var(--card2);color:var(--text);font-size:.95rem;outline:none}
  input:focus{border-color:var(--primary)}
  button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;background:var(--primary);color:#052e16;font-weight:700;font-size:1rem;cursor:pointer;transition:.15s}
  button:hover{background:var(--primary-dark);color:#fff}
  button.secondary{background:#334155;color:var(--text)}
  button.secondary:hover{background:#475569}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:1.15rem;font-weight:700}
  .stat .l{font-size:.72rem;color:var(--muted);margin-top:4px}
  .bar-wrap{background:#0b1120;border-radius:8px;height:14px;overflow:hidden;margin:6px 0 14px}
  .bar{height:100%;border-radius:8px;transition:width .4s}
  .alert{padding:12px;border-radius:10px;margin-top:12px;font-size:.9rem;display:none}
  .alert.show{display:block}
  .alert.warn{background:rgba(245,158,11,.15);border:1px solid var(--warn);color:#fbbf24}
  .alert.danger{background:rgba(239,68,68,.15);border:1px solid var(--danger);color:#fca5a5}
  .alert.ok{background:rgba(34,197,94,.12);border:1px solid var(--primary);color:#86efac}
  .score-circle{width:130px;height:130px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;position:relative}
  .score-circle .num{font-size:2rem}
  .score-circle .of{font-size:.75rem;color:var(--muted)}
  .factor{display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0;border-bottom:1px dashed #334155}
  .factor span:last-child{font-weight:700}
  .payday{font-size:1.05rem;padding:10px;border-radius:10px;background:var(--card2);margin-top:8px;text-align:center}
  .payday.today{background:rgba(34,197,94,.2);border:2px solid var(--primary);color:#86efac;font-weight:700}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>💰 Bütçem</h1>
  <p class="sub">Kişisel finans takip ve finans puanı uygulaması</p>

  <!-- GELİR / BİRİKİM -->
  <div class="card">
    <h2>📥 Gelir & Birikim</h2>
    <label>Maaş (örn. 35000)</label>
    <input type="number" id="salary" placeholder="35000" />
    <div class="row">
      <div><label>Birikim</label><input type="number" id="savings" placeholder="5000" /></div>
      <div><label>Yan Birikim</label><input type="number" id="sideSavings" placeholder="2000" /></div>
    </div>
    <label>Maaş Günü (ayın kaçında yatıyor?)</label>
    <input type="number" id="payday" min="1" max="31" placeholder="15" />
    <button onclick="saveIncome()">Kaydet</button>
    <div id="paydayInfo" class="payday" style="display:none"></div>
  </div>

  <!-- HARCAMALAR -->
  <div class="card">
    <h2>💸 Harcamalar</h2>
    <label>Dönem</label>
    <select id="period">
      <option value="daily">Günlük</option>
      <option value="weekly">Haftalık</option>
      <option value="monthly" selected>Aylık</option>
    </select>
    <div class="row">
      <div><label>🍔 Yemek</label><input type="number" id="food" placeholder="0" /></div>
      <div><label>🎉 Eğlence</label><input type="number" id="fun" placeholder="0" /></div>
    </div>
    <div class="row">
      <div><label>🏠 Kira</label><input type="number" id="rent" placeholder="0" /></div>
      <div><label>🚌 Ulaşım</label><input type="number" id="transport" placeholder="0" /></div>
    </div>
    <label>📦 Diğer</label>
    <input type="number" id="other" placeholder="0" />
    <button onclick="addExpense()">Harcama Ekle</button>
    <button class="secondary" onclick="calcAverages()">Ortalamaları Göster</button>
    <div id="avgResult" style="margin-top:12px"></div>
    <div id="spendAlert" class="alert"></div>
  </div>

  <!-- HEDEF -->
  <div class="card">
    <h2>🎯 Hedef Belirleme</h2>
    <label>Hedef Tutarı (TL)</label>
    <input type="number" id="goal" placeholder="50000" />
    <label>Aylık ne kadar ayırabilirsin?</label>
    <input type="number" id="goalMonthly" placeholder="5000" />
    <button onclick="calcGoal()">Hedefi Hesapla</button>
    <div id="goalResult" style="margin-top:12px"></div>
  </div>

  <!-- BU AYI ATLATABİLİR MİYİM -->
  <div class="card">
    <h2>🧮 Bu Ayı Atlatabilir miyim?</h2>
    <label>Elindeki Para (örn. 40000 TL)</label>
    <input type="number" id="cash" placeholder="40000" />
    <button onclick="calcSurvival()">Hesapla</button>
    <div id="survivalResult" style="margin-top:12px"></div>
  </div>

  <!-- FİNANS PUANI -->
  <div class="card">
    <h2>📊 Finans Puanın</h2>
    <div class="score-circle" id="scoreCircle">
      <div class="num" id="scoreNum">--</div>
      <div class="of">/ 100</div>
    </div>
    <button onclick="calcScore()">Puanı Hesapla</button>
    <div id="scoreFactors" style="margin-top:12px"></div>
  </div>
</div>

<script>
const TL = n => (isNaN(n)?0:n).toLocaleString('tr-TR',{maximumFractionDigits:0}) + ' TL';
const val = id => parseFloat(document.getElementById(id).value) || 0;
const store = JSON.parse(localStorage.getItem('butceApp')||'{}');
let expenses = store.expenses || [];
let income = store.income || null;

function save(){ localStorage.setItem('butceApp', JSON.stringify({expenses, income})); }

// Sayfa açılışında kayıtlı gelir varsa doldur
if(income){
  salary.value=income.salary; savings.value=income.savings;
  sideSavings.value=income.sideSavings; payday.value=income.payday;
  showPayday();
}

function saveIncome(){
  income = { salary:val('salary'), savings:val('savings'), sideSavings:val('sideSavings'), payday:parseInt(payday.value)||15 };
  save(); showPayday();
  alertBox('paydayInfo');
}

function showPayday(){
  if(!income) return;
  const today=new Date(), d=today.getDate(), pd=income.payday;
  let next=new Date(today.getFullYear(), today.getMonth(), pd);
  if(d>pd) next=new Date(today.getFullYear(), today.getMonth()+1, pd);
  const daysLeft=Math.ceil((next-today)/86400000);
  const el=document.getElementById('paydayInfo');
  el.style.display='block';
  el.classList.toggle('today', d===pd);
  el.textContent = d===pd
    ? '🎉 Bugün maaş günü! Maaşın bugün yatacak: '+TL(income.salary)
    : `📅 Maaşın her ayın ${pd}'inde yatıyor. Sonraki maaşa ${daysLeft} gün kaldı.`;
}

function addExpense(){
  const e={ period:period.value, date:new Date().toISOString().slice(0,10),
    food:val('food'), fun:val('fun'), rent:val('rent'), transport:val('transport'), other:val('other') };
  e.total=e.food+e.fun+e.rent+e.transport+e.other;
  if(e.total<=0){ alert('Lütfen harcama girin.'); return; }
  expenses.push(e); save();
  ['food','fun','rent','transport','other'].forEach(id=>document.getElementById(id).value='');
  calcAverages(); checkOverspending();
}

// Her kaydı aylık karşılığa çevir
function monthlyOf(e){ return e.period==='daily'? e.total*30 : e.period==='weekly'? e.total*4.33 : e.total; }

function calcAverages(){
  const el=document.getElementById('avgResult');
  if(!expenses.length){ el.innerHTML='<p style="color:var(--muted)">Henüz harcama kaydı yok.</p>'; return; }
  let daily=0, weekly=0, monthly=0;
  expenses.forEach(e=>{
    const m=monthlyOf(e); monthly+=m; weekly+=m/4.33; daily+=m/30;
  });
  const n=expenses.length;
  el.innerHTML=`
    <div class="grid2">
      <div class="stat"><div class="v">${TL(daily)}</div><div class="l">Günlük Ortalama</div></div>
      <div class="stat"><div class="v">${TL(weekly)}</div><div class="l">Haftalık Ortalama</div></div>
      <div class="stat"><div class="v">${TL(monthly)}</div><div class="l">Aylık Toplam</div></div>
      <div class="stat"><div class="v">${n}</div><div class="l">Kayıt Sayısı</div></div>
    </div>`;
}

function monthlyExpenseTotal(){ return expenses.reduce((s,e)=>s+monthlyOf(e),0); }

function checkOverspending(){
  const el=document.getElementById('spendAlert');
  if(!income||!expenses.length){ el.className='alert'; return; }
  const m=monthlyExpenseTotal(), s=income.salary;
  const ratio=s>0? m/s : 1;
  el.className='alert show '+(ratio>0.9?'danger':ratio>0.7?'warn':'ok');
  el.textContent = ratio>0.9
    ? `⚠️ DİKKAT! Aylık harcaman (${TL(m)}) maaşının %${Math.round(ratio*100)}'ine ulaştı. Çok fazla harcama yapıyorsun, frene bas!`
    : ratio>0.7
    ? `⚠️ Uyarı: Harcamaların (${TL(m)}) maaşının %${Math.round(ratio*100)}'i seviyesinde. Dikkatli ol.`
    : `✅ Harcamaların (${TL(m)}) kontrol altında. Maaşının %${Math.round(ratio*100)}'ini harcıyorsun.`;
}

function calcGoal(){
  const g=val('goal'), m=val('goalMonthly'), el=document.getElementById('goalResult');
  if(g<=0||m<=0){ el.innerHTML='<p style="color:var(--danger)">Hedef ve aylık tutar girin.</p>'; return; }
  const months=Math.ceil(g/m);
  const target=new Date(); target.setMonth(target.getMonth()+months);
  el.innerHTML=`<div class="stat"><div class="v">${months} ay</div>
    <div class="l">Hedefe ulaşma süresi (~${target.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})})</div></div>`;
}

function calcSurvival(){
  const cash=val('cash'), el=document.getElementById('survivalResult');
  if(cash<=0){ el.innerHTML='<p style="color:var(--danger)">Para tutarı girin.</p>'; return; }
  const monthly=monthlyExpenseTotal();
  if(monthly<=0){
    el.innerHTML=`<div class="alert show ok">Harcama kaydın olmadığı için genel tahmin yapılamıyor. Önce harcamalarını gir.</div>`; return;
  }
  const days=new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const today=new Date().getDate(), daysLeft=days-today+1;
  const dailyNeed=monthly/days, need=dailyNeed*daysLeft;
  const ok=cash>=need;
  el.innerHTML=`<div class="grid2">
      <div class="stat"><div class="v">${TL(dailyNeed)}</div><div class="l">Günlük İhtiyaç</div></div>
      <div class="stat"><div class="v">${TL(need)}</div><div class="l">Ay Sonuna Kadar Gereken (${daysLeft} gün)</div></div>
    </div>
    <div class="alert show ${ok?'ok':'danger'}" style="margin-top:12px">
      ${ok ? `✅ Evet! ${TL(cash)} ile bu ayı rahat atlatabilirsin. Ay sonunda yaklaşık ${TL(cash-need)} kalır.`
           : `❌ Hayır, ${TL(cash)} yetmez. Ayı tamamlamak için yaklaşık ${TL(need-cash)} daha gerekiyor. Günlük harcamayı ${TL(cash/daysLeft)} ile sınırlamalısın.`}
    </div>`;
}

function calcScore(){
  const el=document.getElementById('scoreFactors');
  if(!income||!income.salary){ el.innerHTML='<p style="color:var(--danger)">Önce maaş ve birikim bilgilerini kaydet.</p>'; return; }
  const s=income.salary, m=monthlyExpenseTotal();
  const sav=(income.savings+income.sideSavings);

  // Alt puanlar
  let balance = m<=s*0.6?20 : m<=s*0.8?15 : m<=s?10 : m<=s*1.2?5 : 0;              // gelir/gider dengesi /20
  let savRate = sav>=s*0.2?20 : sav>=s*0.1?14 : sav>0?8 : 0;                          // birikim oranı /20
  let waste   = (()=>{ const funOther=expenses.reduce((a,e)=>a+(e.period==='daily'?(e.fun+e.other)*30:e.period==='weekly'?(e.fun+e.other)*4.33:(e.fun+e.other)),0);
    const r=s>0?funOther/s:1; return r<=0.1?15 : r<=0.25?10 : 5; })();               // gereksiz harcama /15
  let goalFit = val('goal')>0 && sav>=val('goalMonthly')*0.8 ? 15 : val('goal')>0 ? 8 : 5; // hedefe uyum /15
  let budget  = m>0 && m<=s ? 15 : m===0 ? 8 : 5;                                    // aylık bütçe /15
  let debt    = m>s ? 5 : 15;                                                        // borç yükü /15

  const total=Math.min(100, balance+savRate+waste+goalFit+budget+debt);
  document.getElementById('scoreNum').textContent=total;
  const c=total>=70?'var(--primary)':total>=45?'var(--warn)':'var(--danger)';
  document.getElementById('scoreCircle').style.background=
    `conic-gradient(${c} ${total*3.6}deg, #0b1120 0deg)`;
  el.innerHTML=`<p style="font-size:.8rem;color:var(--muted);margin-bottom:6px">Puanı etkileyen faktörler:</p>
    <div class="factor"><span>Gelir/gider dengesi</span><span>${balance}/20</span></div>
    <div class="factor"><span>Birikim oranı</span><span>${savRate}/20</span></div>
    <div class="factor"><span>Gereksiz harcama</span><span>${waste}/15</span></div>
    <div class="factor"><span>Hedeflere uyum</span><span>${goalFit}/15</span></div>
    <div class="factor"><span>Aylık bütçe</span><span>${budget}/15</span></div>
    <div class="factor"><span>Borç yükü</span><span>${debt}/15</span></div>
    <div class="alert show ${total>=70?'ok':total>=45?'warn':'danger'}" style="margin-top:12px">
      ${total>=70?'🎉 Harika! Finansal durumun sağlıklı görünüyor.':total>=45?'😐 Fena değil, ama birikimini artırıp gereksiz harcamaları kısabilirsin.':'⚠️ Finansal durumun riskli. Harcamalarını acilen gözden geçir!'}
    </div>`;
}

function alertBox(){}

// Açılışta ortalamaları göster
calcAverages(); checkOverspending();
</script>
</body>
</html>
