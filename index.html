<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KÜTÜPHANE: SON ÇIKIŞ</title>
<style>
  :root{
    --bg:#0b0a08;
    --panel:#171310;
    --panel-2:#211c16;
    --line:#3a3226;
    --amber:#c9a45c;
    --amber-dim:#8a7140;
    --text:#e7ddc9;
    --text-dim:#a89c86;
    --danger:#9a3b3b;
    --danger-bright:#e05b5b;
    --good:#5b8c5a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  .display{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;}

  #app{position:fixed; inset:0; width:100%; height:100%;}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .hidden{display:none !important;}

  /* ---------- MENU ---------- */
  #menu-screen{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,164,92,0.10), transparent 60%),
      linear-gradient(180deg, #0b0a08 0%, #100d09 100%);
  }
  .title-block{text-align:center; margin-bottom:36px;}
  .kicker{color:var(--amber-dim); letter-spacing:0.35em; font-size:11px; margin-bottom:10px;}
  .game-title{
    font-size:clamp(28px,8vw,44px); line-height:1.15; color:var(--amber);
    text-shadow:0 0 24px rgba(201,164,92,0.25);
  }
  .game-title small{display:block; font-size:0.42em; color:var(--text-dim); letter-spacing:0.08em; margin-top:6px;}

  .menu-card{
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--line); border-radius:4px; padding:22px;
  }
  .field-label{font-size:12px; color:var(--text-dim); margin-bottom:6px; display:block;}
  input[type=text]{
    width:100%; padding:13px 12px; margin-bottom:14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
    color:var(--text); font-size:16px; letter-spacing:0.03em;
  }
  input[type=text]:focus{outline:none; border-color:var(--amber-dim);}
  .btn{
    width:100%; padding:15px 14px; margin-bottom:10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
    color:var(--text); font-size:15px; letter-spacing:0.02em; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:active{background:#2a251d;}
  .btn-primary{background:linear-gradient(180deg,#3a2f1c,#2a2213); border-color:var(--amber-dim); color:var(--amber);}
  .btn-primary:active{background:#4a3c22;}
  .btn-danger{border-color:var(--danger); color:#d99;}
  .btn-row{display:flex; gap:8px;}
  .btn-row input{margin-bottom:0;}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim); font-size:13px; padding:10px;}
  .menu-footer{margin-top:14px; display:flex; gap:8px; justify-content:center;}

  /* ---------- LOBBY ---------- */
  .room-code{
    font-size:34px; letter-spacing:0.25em; color:var(--amber);
    text-align:center; padding:14px 0; border:1px dashed var(--amber-dim); border-radius:4px; margin-bottom:18px;
  }
  .player-list{width:100%; max-width:380px; margin-bottom:18px;}
  .player-row{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:3px; margin-bottom:6px; font-size:14px;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:var(--amber-dim);}
  .host-tag{margin-left:auto; font-size:10px; color:var(--amber-dim); letter-spacing:0.05em;}

  /* ---------- GAME ---------- */
  #game-screen{padding:0; justify-content:flex-start; align-items:stretch;}
  #gameCanvas{position:absolute; inset:0; width:100%; height:100%; background:#0a0908;}

  .hud-top{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px; pointer-events:none; z-index:20;
  }
  .timer-box{
    font-variant-numeric:tabular-nums; font-size:26px; color:var(--amber);
    background:rgba(10,9,8,0.55); border:1px solid var(--line); border-radius:4px; padding:6px 16px;
    letter-spacing:0.05em;
  }
  .timer-box.low{color:var(--danger-bright); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}

  .role-chip{
    font-size:11px; letter-spacing:0.08em; background:rgba(10,9,8,0.55);
    border:1px solid var(--line); border-radius:4px; padding:6px 10px; color:var(--text-dim);
  }
  .role-chip.avci{color:var(--danger-bright); border-color:var(--danger);}
  .role-chip.kacan{color:var(--good);}

  .ammo-box{
    position:absolute; top:calc(56px + env(safe-area-inset-top)); right:14px; z-index:20;
    background:rgba(10,9,8,0.55); border:1px solid var(--danger); border-radius:4px;
    padding:6px 12px; font-size:13px; color:var(--danger-bright); pointer-events:none;
  }

  .msg-log{
    position:absolute; top:calc(56px + env(safe-area-inset-top)); left:14px; z-index:20;
    display:flex; flex-direction:column; gap:3px; max-width:56%; pointer-events:none;
  }
  .msg-line{font-size:12px; background:rgba(10,9,8,0.5); padding:4px 8px; border-radius:3px; color:var(--text-dim); animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);}}

  .role-reveal{
    position:absolute; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:rgba(6,5,4,0.92);
  }
  .role-reveal-inner{text-align:center;}
  .role-reveal .role-word{font-size:46px; letter-spacing:0.06em;}
  .role-reveal .role-word.avci{color:var(--danger-bright);}
  .role-reveal .role-word.kacan{color:var(--good);}
  .role-reveal p{color:var(--text-dim); max-width:320px; margin:14px auto 0; font-size:14px; line-height:1.5;}

  /* Joystick */
  .joystick-zone{position:absolute; left:0; bottom:0; width:45%; height:45%; z-index:25;}
  .joy-base{
    position:absolute; width:110px; height:110px; border-radius:50%;
    background:rgba(23,19,16,0.55); border:1px solid var(--line);
  }
  .joy-knob{
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(201,164,92,0.35); border:1px solid var(--amber-dim);
  }

  .action-cluster{
    position:absolute; right:14px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:25;
    display:grid; grid-template-columns:repeat(2,64px); gap:10px;
  }
  .action-btn{
    width:64px; height:64px; border-radius:50%; background:rgba(23,19,16,0.7);
    border:1px solid var(--line); color:var(--text); font-size:11px; letter-spacing:0.02em;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2;
  }
  .action-btn:active{background:rgba(58,47,28,0.9);}
  .action-btn.interact{border-color:var(--amber-dim); color:var(--amber);}
  .action-btn.shoot{border-color:var(--danger); color:var(--danger-bright);}
  .action-btn.disabled{opacity:0.35;}

  .inv-bar{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:25; display:flex; gap:6px; background:rgba(10,9,8,0.55); padding:6px; border-radius:4px; border:1px solid var(--line);
  }
  .inv-slot{
    width:38px; height:38px; border-radius:3px; background:var(--panel-2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }

  .quickchat{
    position:absolute; left:50%; transform:translateX(-50%); top:calc(56px + env(safe-area-inset-top));
    z-index:24; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:80%;
  }
  .qc-btn{
    font-size:11px; padding:6px 9px; background:rgba(23,19,16,0.7); border:1px solid var(--line);
    border-radius:12px; color:var(--text-dim);
  }
  .qc-toggle{
    position:absolute; left:14px; bottom:calc(14px + env(safe-area-inset-bottom) + 0px); z-index:26;
  }

  /* Modals */
  .modal-overlay{
    position:absolute; inset:0; z-index:70; background:rgba(6,5,4,0.85);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--amber-dim); border-radius:5px; padding:22px;
    width:100%; max-width:340px; text-align:center;
  }
  .modal-box h3{color:var(--amber); margin:0 0 8px 0; font-size:18px;}
  .modal-box p{color:var(--text-dim); font-size:13px; margin:0 0 16px 0; line-height:1.5;}
  .code-inputs{display:flex; gap:8px; justify-content:center; margin-bottom:18px;}
  .code-inputs input{
    width:46px; height:56px; text-align:center; font-size:24px; padding:0;
    background:var(--panel-2); border:1px solid var(--line); border-radius:4px; color:var(--amber);
  }

  .end-screen{
    position:absolute; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(4,3,2,0.95);
  }
  .end-title{font-size:34px; margin-bottom:10px;}
  .end-title.win{color:var(--good);}
  .end-title.lose{color:var(--danger-bright);}

  .howto-text{text-align:left; font-size:13px; color:var(--text-dim); line-height:1.6; max-height:50vh; overflow-y:auto;}
  .howto-text b{color:var(--text);}
</style>
</head>
<body>
<div id="app">

  <!-- ============ MENU ============ -->
  <div id="menu-screen" class="screen">
    <div class="title-block">
      <div class="kicker display">GİZLİ AVCI · GERÇEK ZAMANLI</div>
      <div class="game-title display">KÜTÜPHANE<small>SON ÇIKIŞ</small></div>
    </div>

    <div class="menu-card">
      <label class="field-label">Adın</label>
      <input type="text" id="nameInput" maxlength="14" placeholder="Örn. Aslan">

      <button class="btn btn-primary" id="btnCreateRoom">ODA OLUŞTUR</button>

      <div class="btn-row">
        <input type="text" id="joinCodeInput" maxlength="6" placeholder="ODA KODU" style="text-transform:uppercase;">
        <button class="btn" id="btnJoinRoom" style="width:auto; white-space:nowrap;">KATIL</button>
      </div>

      <div class="menu-footer">
        <button class="btn btn-ghost" id="btnHowTo" style="width:auto;">NASIL OYNANIR?</button>
        <button class="btn btn-ghost" id="btnSettings" style="width:auto;">AYARLAR</button>
      </div>
    </div>
    <div id="menuError" style="color:var(--danger-bright); font-size:12px; margin-top:12px; min-height:16px;"></div>
  </div>

  <!-- ============ LOBBY ============ -->
  <div id="lobby-screen" class="screen hidden">
    <div class="kicker display">ODA KODU</div>
    <div class="room-code" id="lobbyCode">------</div>

    <div class="player-list" id="lobbyPlayers"></div>

    <button class="btn btn-primary hidden" id="btnStartGame" style="max-width:380px;">OYUNU BAŞLAT</button>
    <p id="lobbyWaitMsg" style="color:var(--text-dim); font-size:13px;">Host'un başlatmasını bekliyorsun...</p>
    <button class="btn btn-ghost" id="btnLeaveLobby" style="max-width:380px; width:100%;">Odadan Ayrıl</button>
  </div>

  <!-- ============ GAME ============ -->
  <div id="game-screen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="hud-top">
      <div class="timer-box display" id="timerBox">10:00</div>
      <div class="role-chip" id="roleChip">-</div>
    </div>

    <div class="ammo-box hidden" id="ammoBox">MERMİ: 1/1</div>
    <div class="msg-log" id="msgLog"></div>
    <div class="quickchat" id="quickChat"></div>

    <div class="joystick-zone" id="joyZone">
      <div class="joy-base" id="joyBase"></div>
      <div class="joy-knob" id="joyKnob"></div>
    </div>

    <div class="inv-bar" id="invBar"></div>

    <div class="action-cluster">
      <button class="action-btn interact" id="btnInteract">İNCELE</button>
      <button class="action-btn" id="btnRun">KOŞ</button>
      <button class="action-btn" id="btnCrouch">EĞİL</button>
      <button class="action-btn shoot hidden" id="btnShoot">ATEŞ ET</button>
    </div>

    <div id="roleReveal" class="role-reveal hidden">
      <div class="role-reveal-inner">
        <div class="kicker display">ROLÜN</div>
        <div class="role-word display" id="roleWord">-</div>
        <p id="roleDesc"></p>
        <button class="btn btn-primary" id="btnRoleOk" style="max-width:220px; margin-top:18px;">ANLAŞILDI</button>
      </div>
    </div>

    <div id="puzzleModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 class="display">ŞİFRELİ KİLİT</h3>
        <p>Kapıyı açmak için 4 haneli kodu gir.</p>
        <div class="code-inputs" id="codeInputs">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
          <input type="text" maxlength="1" inputmode="numeric">
        </div>
        <button class="btn btn-primary" id="btnCodeSubmit">DENE</button>
        <button class="btn btn-ghost" id="btnCodeCancel">Vazgeç</button>
      </div>
    </div>

    <div id="howtoModal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width:400px; text-align:left;">
        <h3 class="display" style="text-align:center;">NASIL OYNANIR?</h3>
        <div class="howto-text" id="howtoBody"></div>
        <button class="btn btn-primary" id="btnHowtoClose" style="margin-top:14px;">KAPAT</button>
      </div>
    </div>
  </div>

  <!-- ============ END ============ -->
  <div id="end-screen" class="end-screen hidden">
    <div class="end-title display" id="endTitle">-</div>
    <p id="endSubtitle" style="color:var(--text-dim); margin-bottom:22px;"></p>
    <button class="btn btn-primary" id="btnBackToMenu" style="max-width:260px;">ANA MENÜYE DÖN</button>
  </div>

</div>

<!-- Firebase (aynı proje/config'i mevcut kart oyunu ile paylaşabilirsin, farklı bir root key kullanıyoruz) -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================================
   0) FIREBASE YAPILANDIRMASI
   Kendi Firebase projenin bilgilerini buraya gir (kart oyununda kullandığın
   projeyi aynen kullanabilirsin, çakışma olmaması için tüm veriler
   "library_escape/" kökü altında tutuluyor).
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDlekKn5aEDNkmXrT5QoLggakpp96EIJLE",
  authDomain: "taht-ve-koyluler.firebaseapp.com",
  databaseURL: "https://taht-ve-koyluler-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "taht-ve-koyluler",
  storageBucket: "taht-ve-koyluler.firebasestorage.app",
  messagingSenderId: "941861415005",
  appId: "1:941861415005:web:2e3d3a9027470d7165c5b4"
};

let fb = null, db = null, ROOT = "library_escape";
try{
  fb = firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}catch(e){ console.warn("Firebase henüz yapılandırılmadı:", e); }

/* =========================================================================
   1) TEMEL DURUM
   ========================================================================= */
const state = {
  uid: null,
  name: "Oyuncu",
  roomCode: null,
  isHost: false,
  role: null,           // "avci" | "kacan"
  alive: true,
  x: 400, y: 1900,
  facing: 0,
  moving: {x:0,y:0},
  running: false,
  crouching: false,
  inventory: [],
  players: {},          // uid -> {name,x,y,role,alive,...}  (role sadece kendi rolün için görünür olacak şekilde ele alınır)
  itemsMap: {},          // shelfId -> {type,x,y,collectedBy} - host tarafından üretilir
  door: {locked:true, sigorta:false, elektrik:false, anahtarParcasi:0, sifreCozuldu:false, mekanizma:false},
  timerEndAt: null,
  gameState: "menu",     // menu/lobby/playing/ended
  winner: null,
  huntAmmo: 1,
  huntReloadEndAt: null,
  nearShelf: null,
  nearDoorPanel: false,
  nearExitDoor: false,
  localSeed: 1
};

function uid(){ return 'p_' + Math.random().toString(36).slice(2,10); }
function roomCodeGen(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s=""; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
state.uid = uid();

/* =========================================================================
   2) HARİTA VERİSİ
   Basit bir "kitaplık ızgarası + özel odalar" haritası. Duvarlar/raflar
   dikdörtgen engel olarak tutulur; oyuncu çarpışması bunlara göre yapılır.
   ========================================================================= */
const WORLD_W = 3000, WORLD_H = 2200;
const shelves = []; // {id,x,y,w,h, hasItem:false}
const walls = [];   // {x,y,w,h} - dış duvarlar / oda duvarları (engel, aranamaz)

function buildMap(){
  shelves.length = 0; walls.length = 0;
  // Dış duvarlar
  walls.push({x:0,y:0,w:WORLD_W,h:20});
  walls.push({x:0,y:WORLD_H-20,w:WORLD_W,h:20});
  walls.push({x:0,y:0,w:20,h:WORLD_H});
  walls.push({x:WORLD_W-20,y:0,w:20,h:WORLD_H});

  // Ana kitaplık ızgarası (koridorlarla ayrılmış raf blokları)
  let id = 0;
  for(let row=0; row<7; row++){
    for(let col=0; col<6; col++){
      const x = 220 + col*430;
      const y = 260 + row*260;
      const w = 300, h = 46;
      shelves.push({id:'sh'+(id++), x, y, w, h, hasItem:false});
    }
  }

  // Arşiv bölümü (sağ alt, kapılı oda hissi veren duvarlarla çevrili, girişi açık)
  walls.push({x:2300,y:1650,w:600,h:20});
  walls.push({x:2300,y:1650,w:20,h:280});
  walls.push({x:2300,y:1910,w:260,h:20});
  shelves.push({id:'sh_archive1', x:2380, y:1720, w:220, h:44, hasItem:false});
  shelves.push({id:'sh_archive2', x:2380, y:1820, w:220, h:44, hasItem:false});

  // Depo (sol alt)
  walls.push({x:120,y:1650,w:500,h:20});
  walls.push({x:600,y:1650,w:20,h:280});
  walls.push({x:120,y:1910,w:260,h:20});
  shelves.push({id:'sh_depo1', x:180, y:1720, w:200, h:44, hasItem:false});
  shelves.push({id:'sh_depo2', x:180, y:1820, w:200, h:44, hasItem:false});

  // Gizli oda (harita ortası, dar geçitle)
  walls.push({x:1350,y:1000,w:20,h:220});
  walls.push({x:1350,y:1000,w:260,h:20});
  walls.push({x:1590,y:1000,w:20,h:220});
  shelves.push({id:'sh_secret', x:1420, y:1080, w:140, h:44, hasItem:false});

  // Elektrik paneli (sabit interaktif nokta, kilitli kapı görevi)
  state.doorPanelPos = {x:1500, y:1950};
  // Çıkış kapısı
  state.exitDoorPos = {x:1500, y:80};
}
buildMap();

const ITEM_TYPES = [
  {key:'anahtar1', label:'Anahtar Parçası', icon:'🔑'},
  {key:'anahtar2', label:'Anahtar Parçası', icon:'🔑'},
  {key:'anahtar3', label:'Anahtar Parçası', icon:'🔑'},
  {key:'sigorta', label:'Sigorta', icon:'🔌'},
  {key:'kablo', label:'Elektrik Kablosu', icon:'⚡'},
  {key:'sifre_kagidi', label:'Şifre Kağıdı', icon:'📜'},
  {key:'mekanizma_parcasi', label:'Mekanizma Parçası', icon:'⚙️'},
];

function generateItemLayout(seedStr){
  // basit deterministik seed -> shuffle
  let seed = 0; for(const c of seedStr) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
  function rnd(){ seed = (seed*1103515245 + 12345) >>> 0; return (seed>>>8) / 16777216; }
  const pool = shelves.map(s=>s.id);
  for(let i=pool.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const layout = {};
  ITEM_TYPES.forEach((it, i)=>{
    const shelfId = pool[i % pool.length];
    layout[shelfId] = {type: it.key, collectedBy:null};
  });
  // gizli oda rafına özel bir şey koymayı garantile (opsiyonel dokunuş)
  return layout;
}

/* =========================================================================
   3) YARDIMCI: ekran geçişleri
   ========================================================================= */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* =========================================================================
   4) MENÜ
   ========================================================================= */
const nameInput = document.getElementById('nameInput');
const menuError = document.getElementById('menuError');
nameInput.value = localStorage.getItem?.('lib_escape_name') || "";

document.getElementById('btnCreateRoom').addEventListener('click', async ()=>{
  if(!db){ menuError.textContent = "Firebase yapılandırması eksik. Kod içindeki firebaseConfig alanını doldur."; return; }
  const name = (nameInput.value||"Oyuncu").trim().slice(0,14) || "Oyuncu";
  state.name = name;
  try{ localStorage.setItem('lib_escape_name', name); }catch(e){}

  const code = roomCodeGen();
  setMenuBusy(true, "Oda oluşturuluyor...");
  try{
    const roomRef = db.ref(`${ROOT}/rooms/${code}`);
    await roomRef.set({
      host: state.uid,
      gameState: "lobby",
      createdAt: Date.now(),
      players: { [state.uid]: {name, ready:true, x:400,y:1900, alive:true, joinedAt:Date.now()} }
    });

    setMenuBusy(false, "");

  }catch(err){

  }
});

document.getElementById('btnJoinRoom').addEventListener('click', async ()=>{
  if(!db){ menuError.textContent = "Firebase yapılandırması eksik. Kod içindeki firebaseConfig alanını doldur."; return; }
  const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
  const name = (nameInput.value||"Oyuncu").trim().slice(0,14) || "Oyuncu";
  if(code.length!==6){ menuError.textContent = "Oda kodu 6 karakter olmalı."; return; }
  state.name = name;
  try{ localStorage.setItem('lib_escape_name', name); }catch(e){}

  setMenuBusy(true, "Odaya bağlanılıyor...");
  try{
    const roomRef = db.ref(`${ROOT}/rooms/${code}`);
    const snap = await roomRef.get();
    if(!snap.exists()){ setMenuBusy(false, "Bu kodla bir oda bulunamadı."); return; }
    const room = snap.val();
    if(room.gameState !== "lobby"){ setMenuBusy(false, "Bu oda zaten oyuna başladı."); return; }
    const playerCount = Object.keys(room.players||{}).length;
    if(playerCount >= 6){ setMenuBusy(false, "Oda dolu (maksimum 6 oyuncu)."); return; }

    await roomRef.child('players/'+state.uid).set({name, ready:true, x:400,y:1900, alive:true, joinedAt:Date.now()});
    state.roomCode = code; state.isHost = false;
    setMenuBusy(false, "");
    enterLobby(code);
  }catch(err){
    console.error("Odaya katılma hatası:", err);
    setMenuBusy(false, "Odaya katılamadın: " + (err && err.message ? err.message : "Firebase bağlantı hatası."));
  }
});

let lobbyRef = null, lobbyListener = null;

function enterLobby(code){
  showScreen('lobby-screen');
  document.getElementById('lobbyCode').textContent = code;
  document.getElementById('btnStartGame').classList.toggle('hidden', !state.isHost);
  document.getElementById('lobbyWaitMsg').classList.toggle('hidden', state.isHost);

  lobbyRef = db.ref(`${ROOT}/rooms/${code}`);
  lobbyListener = lobbyRef.on('value', snap=>{
    const room = snap.val();
    if(!room) return;
    renderLobbyPlayers(room.players||{}, room.host);
    if(room.gameState === 'playing' && state.gameState !== 'playing'){
      startClientGame(room);
    }
    if(room.gameState === 'ended'){
      state.winner = room.winner;
      showEndScreen(room.winner);
    }
  });

  window.addEventListener('beforeunload', cleanupOnLeave);
}

function renderLobbyPlayers(players, hostUid){
  const el = document.getElementById('lobbyPlayers');
  el.innerHTML = '';
  Object.entries(players).forEach(([pid,p])=>{
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `<span class="dot"></span><span>${escapeHtml(p.name||'Oyuncu')}</span>` +
      (pid===hostUid ? `<span class="host-tag">HOST</span>` : '');
    el.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('btnStartGame').addEventListener('click', async ()=>{
  const roomRef = db.ref(`${ROOT}/rooms/${state.roomCode}`);
  const snap = await roomRef.get();
  const room = snap.val();
  const playerIds = Object.keys(room.players||{});
  if(playerIds.length < 2){ alert("Oyuna başlamak için en az 2 oyuncu gerekli."); return; }

  const hunterId = playerIds[Math.floor(Math.random()*playerIds.length)];
  const layout = generateItemLayout(state.roomCode + '_' + Date.now());
  const spawns = {};
  playerIds.forEach((pid,i)=>{
    spawns[pid] = { x: 350 + (i%3)*120, y: 1980 - Math.floor(i/3)*80, alive:true };
  });

  await roomRef.update({
    gameState: 'playing',
    hunter: hunterId,
    itemsMap: layout,
    door: {locked:true, sigorta:false, elektrik:false, anahtarParcasi:0, sifreCozuldu:false, mekanizma:false, code: fourDigitCode()},
    timerStartedAt: Date.now(),
    timerDurationMs: 10*60*1000,
    huntAmmo: {ammo:1, reloadEndAt:null},
    winner: null
  });
  playerIds.forEach(pid=>{
    roomRef.child('players/'+pid).update({x:spawns[pid].x, y:spawns[pid].y, alive:true, inventory:[]});
  });
});

function fourDigitCode(){
  let s=''; for(let i=0;i<4;i++) s+= Math.floor(Math.random()*10);
  return s;
}

let gameRoomRef = null, gameListener = null;
let rafId = null;
let lastSyncTs = 0;

function startClientGame(room){
  state.gameState = 'playing';
  state.role = room.hunter === state.uid ? 'avci' : 'kacan';
  state.itemsMap = room.itemsMap || {};
  state.door = room.door || state.door;
  state.timerEndAt = (room.timerStartedAt||Date.now()) + (room.timerDurationMs||600000);
  state.inventory = [];
  const me = (room.players||{})[state.uid];
  if(me){ state.x = me.x; state.y = me.y; state.alive = me.alive!==false; }

  showScreen('game-screen');
  setupQuickChat();
  showRoleReveal(state.role);

  document.getElementById('btnShoot').classList.toggle('hidden', state.role !== 'avci');
  document.getElementById('roleChip').textContent = state.role==='avci' ? 'GİZLİ ROL' : 'GİZLİ ROL';
  document.getElementById('roleChip').className = 'role-chip'; // rolünü ele vermesin, herkeste aynı görünür

  gameRoomRef = db.ref(`${ROOT}/rooms/${state.roomCode}`);
  gameListener = gameRoomRef.on('value', snap=>{
    const r = snap.val();
    if(!r) return;
    state.players = r.players || {};
    state.door = r.door || state.door;
    state.itemsMap = r.itemsMap || state.itemsMap;
    if(r.timerStartedAt) state.timerEndAt = r.timerStartedAt + (r.timerDurationMs||600000);
    const hunterAmmo = r.huntAmmo || {ammo:1, reloadEndAt:null};
    if(state.role==='avci'){ state.huntAmmo = hunterAmmo.ammo; state.huntReloadEndAt = hunterAmmo.reloadEndAt; }
    const me = state.players[state.uid];
    if(me){ state.alive = me.alive !== false; state.inventory = me.inventory || []; }

    if(r.gameState === 'ended' && state.gameState !== 'ended'){
      state.gameState = 'ended';
      showEndScreen(r.winner);
    }
    checkWinConditionsAsClient(r);
  });

  if(rafId) cancelAnimationFrame(rafId);
  loop();
}

function checkWinConditionsAsClient(room){
  // Herhangi bir istemci, koşulları tespit ederse kazananı yazabilir (last-write-wins, prototip için yeterli).
  if(room.gameState !== 'playing') return;
  const players = room.players || {};
  const kacanlar = Object.entries(players).filter(([pid])=> pid !== room.hunter);
  const kacanlarHepsiOldu = kacanlar.length>0 && kacanlar.every(([,p])=> p.alive===false);
  const suresiBitti = Date.now() > (room.timerStartedAt + (room.timerDurationMs||600000));
  const kacanKactiMi = kacanlar.some(([,p])=> p.escaped===true);

  if(kacanKactiMi){
    gameRoomRef.update({gameState:'ended', winner:'kacanlar'});
  } else if(kacanlarHepsiOldu){
    gameRoomRef.update({gameState:'ended', winner:'avci'});
  } else if(suresiBitti){
    gameRoomRef.update({gameState:'ended', winner:'avci'});
  }
}

/* ---- Joystick ---- */
const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
let joyActive = false, joyTouchId = null, joyOrigin = {x:0,y:0};
const JOY_RADIUS = 55;

function setJoyVisual(x,y, show){
  joyBase.style.display = show ? 'block':'none';
  joyKnob.style.display = show ? 'block':'none';
  if(!show) return;
  joyBase.style.left = (x-55)+'px'; joyBase.style.top = (y-55)+'px';
  joyKnob.style.left = (x-25)+'px'; joyKnob.style.top = (y-25)+'px';
}
setJoyVisual(0,0,false);

joyZone.addEventListener('touchstart', e=>{
  const t = e.changedTouches[0];
  joyActive = true; joyTouchId = t.identifier;
  joyOrigin = {x:t.clientX, y:t.clientY};
  setJoyVisual(t.clientX, t.clientY, true);
  e.preventDefault();
}, {passive:false});

joyZone.addEventListener('touchmove', e=>{
  for(const t of e.changedTouches){
    if(t.identifier !== joyTouchId) continue;
    let dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
    const dist = Math.hypot(dx,dy);
    if(dist > JOY_RADIUS){ dx = dx/dist*JOY_RADIUS; dy = dy/dist*JOY_RADIUS; }
    joyKnob.style.left = (joyOrigin.x+dx-25)+'px';
    joyKnob.style.top = (joyOrigin.y+dy-25)+'px';
    state.moving.x = dx/JOY_RADIUS; state.moving.y = dy/JOY_RADIUS;
    if(Math.hypot(state.moving.x,state.moving.y) > 0.05){
      state.facing = Math.atan2(state.moving.y, state.moving.x);
    }
  }
  e.preventDefault();
}, {passive:false});

function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier !== joyTouchId) continue;
    joyActive = false; joyTouchId = null;
    state.moving = {x:0,y:0};
    setJoyVisual(0,0,false);
  }
}
joyZone.addEventListener('touchend', joyEnd);
joyZone.addEventListener('touchcancel', joyEnd);

/* =========================================================================
   7) OYUN MANTIĞI: hareket, çarpışma, etkileşim
   ========================================================================= */
const PLAYER_RADIUS = 18;

function rectsOverlapCircle(cx,cy,r, rect){
  const nx = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  return Math.hypot(cx-nx, cy-ny) < r;
}

function tryMove(dx,dy){
  const speedBase = state.crouching ? 90 : (state.running ? 230 : 150);
  const nx = state.x + dx*speedBase*state.dt;
  const ny = state.y + dy*speedBase*state.dt;

  let blockedX = false, blockedY = false;
  for(const obs of [...shelves, ...walls]){
    if(rectsOverlapCircle(nx, state.y, PLAYER_RADIUS, obs)) blockedX = true;
    if(rectsOverlapCircle(state.x, ny, PLAYER_RADIUS, obs)) blockedY = true;
  }
  if(!blockedX) state.x = Math.max(20,Math.min(WORLD_W-20, nx));
  if(!blockedY) state.y = Math.max(20,Math.min(WORLD_H-20, ny));
}

function nearestShelf(){
  let best=null, bestD=90;
  for(const s of shelves){
    const cx = s.x+s.w/2, cy = s.y+s.h/2;
    const d = Math.hypot(state.x-cx, state.y-cy);
    if(d<bestD){ bestD=d; best=s; }
  }
  return best;
}

function distTo(pos){ return Math.hypot(state.x-pos.x, state.y-pos.y); }

function handleInteract(){
  if(!state.alive) return;

  // Çıkış kapısı
  if(distTo(state.exitDoorPos) < 90){
    if(!state.door.locked){
      gameRoomRef.child('players/'+state.uid).update({escaped:true});
      addMsgLine("Kapıdan kaçtın!");
    } else {
      addMsgLine("Kapı hâlâ kilitli.");
    }
    return;
  }

  // Elektrik paneli
  if(distTo(state.doorPanelPos) < 90){
    if(!state.door.sigorta){ addMsgLine("Önce bir sigorta bulmalısın."); return; }
    if(state.door.elektrik){ addMsgLine("Elektrik zaten açık."); return; }
    gameRoomRef.child('door').update({elektrik:true});
    addMsgLine("Elektrik açıldı!");
    return;
  }

  // En yakın kitaplık
  const shelf = nearestShelf();
  if(!shelf) return;
  const entry = state.itemsMap[shelf.id];
  if(!entry){
    addMsgLine("Bu raf boş.");
    return;
  }
  if(entry.collectedBy){
    addMsgLine("Burası zaten aranmış.");
    return;
  }
  if(state.inventory.length >= 4){
    addMsgLine("Envanterin dolu (0/4).");
    return;
  }
  if(entry.type === 'sifre_kagidi'){
    openPuzzleModal();
  }
  collectItem(shelf.id, entry.type);
}

function collectItem(shelfId, type){
  gameRoomRef.child('itemsMap/'+shelfId+'/collectedBy').set(state.uid);
  const newInv = [...state.inventory, type];
  gameRoomRef.child('players/'+state.uid+'/inventory').set(newInv);

  if(type==='sigorta') gameRoomRef.child('door/sigorta').set(true);
  if(type==='anahtar1'||type==='anahtar2'||type==='anahtar3'){
    const current = state.door.anahtarParcasi||0;
    gameRoomRef.child('door/anahtarParcasi').set(current+1);
  }
  const itLabel = (ITEM_TYPES.find(i=>i.key===type)||{}).label || type;
  addMsgLine(`${itLabel} bulundu!`);
  maybeUnlockDoor();
}

function maybeUnlockDoor(){
  const d = state.door;
  const ready = d.sigorta && d.elektrik && (d.anahtarParcasi||0)>=3 && d.sifreCozuldu && d.mekanizma;
  if(ready && d.locked){
    gameRoomRef.child('door/locked').set(false);
  }
}

/* ---- Avcı: ateş etme ---- */
async function handleShoot(){
  if(state.role !== 'avci' || !state.alive) return;
  if(state.huntAmmo < 1) { addMsgLine("Mermi dolmadı."); return; }
  if(state.huntReloadEndAt && Date.now() < state.huntReloadEndAt) return;

  // en yakın kaçanı, bakış yönü + menzil içinde ara (basit koni kontrolü)
  let target = null, bestD = 260;
  for(const [pid,p] of Object.entries(state.players)){
    if(pid === state.uid || p.alive===false) continue;
    const dx = p.x-state.x, dy = p.y-state.y;
    const d = Math.hypot(dx,dy);
    if(d > bestD) continue;
    const angleToTarget = Math.atan2(dy,dx);
    let diff = Math.abs(angleToTarget - state.facing);
    if(diff > Math.PI) diff = 2*Math.PI - diff;
    if(diff < 0.7){ bestD = d; target = pid; }
  }

  await gameRoomRef.child('huntAmmo').set({ammo:0, reloadEndAt: Date.now()+10000});
  if(target){
    await gameRoomRef.child('players/'+target).update({alive:false});
    addMsgLine("İsabet!");
  } else {
    addMsgLine("Iskaladın.");
  }
  setTimeout(()=>{
    gameRoomRef.child('huntAmmo').set({ammo:1, reloadEndAt:null});
  }, 10000);
}

/* =========================================================================
   8) SENKRONİZASYON (kendi konumumuzu Firebase'e yaz)
   ========================================================================= */
function syncSelfPosition(){
  if(!gameRoomRef) return;
  const now = performance.now();
  if(now - lastSyncTs < 120) return; // ~8 kez/sn ile sınırla
  lastSyncTs = now;
  gameRoomRef.child('players/'+state.uid).update({x: state.x, y: state.y, facing: state.facing});
}

/* =========================================================================
   9) RENDER
   ========================================================================= */
let lastFrameTs = performance.now();
function loop(){
  const now = performance.now();
  state.dt = Math.min(0.05, (now-lastFrameTs)/1000);
  lastFrameTs = now;

  if(state.alive) tryMove(state.moving.x, state.moving.y);
  syncSelfPosition();
  updateHud();
  draw();

  rafId = requestAnimationFrame(loop);
}

function updateHud(){
  const remainMs = Math.max(0, state.timerEndAt - Date.now());
  const mm = String(Math.floor(remainMs/60000)).padStart(2,'0');
  const ss = String(Math.floor((remainMs%60000)/1000)).padStart(2,'0');
  const timerBox = document.getElementById('timerBox');
  timerBox.textContent = `${mm}:${ss}`;
  timerBox.classList.toggle('low', remainMs < 60000);

  const ammoBox = document.getElementById('ammoBox');
  if(state.role==='avci'){
    ammoBox.classList.remove('hidden');
    if(state.huntAmmo>=1){
      ammoBox.textContent = 'MERMİ: 1/1';
    } else {
      const remain = Math.max(0, Math.ceil((state.huntReloadEndAt-Date.now())/1000));
      ammoBox.textContent = `YENİDEN DOLDURULUYOR: ${remain}`;
    }
  } else {
    ammoBox.classList.add('hidden');
  }

  const invBar = document.getElementById('invBar');
  invBar.innerHTML = '';
  for(let i=0;i<4;i++){
    const slot = document.createElement('div');
    slot.className = 'inv-slot';
    const key = state.inventory[i];
    slot.textContent = key ? ((ITEM_TYPES.find(t=>t.key===key)||{}).icon || '▪') : '';
    invBar.appendChild(slot);
  }
}

function draw(){
  ctx.save();
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.fillStyle = '#0a0908';
  ctx.fillRect(0,0, window.innerWidth, window.innerHeight);

  const camX = state.x - window.innerWidth/2;
  const camY = state.y - window.innerHeight/2;
  ctx.translate(-camX, -camY);

  // zemin dokusu (basit ızgara)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for(let x=0;x<WORLD_W;x+=100){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,WORLD_H); ctx.stroke(); }
  for(let y=0;y<WORLD_H;y+=100){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(WORLD_W,y); ctx.stroke(); }

  // duvarlar
  ctx.fillStyle = '#241d15';
  walls.forEach(w=> ctx.fillRect(w.x,w.y,w.w,w.h));

  // raflar
  shelves.forEach(s=>{
    const entry = state.itemsMap[s.id];
    ctx.fillStyle = '#3a2f1f';
    ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.strokeStyle = '#5a4a30';
    ctx.strokeRect(s.x,s.y,s.w,s.h);
    if(entry && entry.collectedBy){
      ctx.fillStyle = 'rgba(120,180,120,0.25)';
      ctx.fillRect(s.x,s.y,s.w,s.h);
    }
  });

  // elektrik paneli
  ctx.fillStyle = state.door.elektrik ? '#5b8c5a' : '#6a4a2a';
  ctx.fillRect(state.doorPanelPos.x-30, state.doorPanelPos.y-20, 60, 40);
  ctx.fillStyle = '#000'; ctx.font = '11px sans-serif'; ctx.textAlign='center';
  ctx.fillStyle = '#e7ddc9';
  ctx.fillText('PANEL', state.doorPanelPos.x, state.doorPanelPos.y-28);

  // çıkış kapısı
  ctx.fillStyle = state.door.locked ? '#5a2020' : '#5b8c5a';
  ctx.fillRect(state.exitDoorPos.x-70, state.exitDoorPos.y-16, 140, 32);
  ctx.fillStyle = '#e7ddc9';
  ctx.fillText(state.door.locked ? 'KİLİTLİ ÇIKIŞ' : 'ÇIKIŞ AÇIK', state.exitDoorPos.x, state.exitDoorPos.y-24);

  // diğer oyuncular
  Object.entries(state.players).forEach(([pid,p])=>{
    if(pid===state.uid) return;
    if(p.alive===false) return;
    ctx.beginPath();
    ctx.fillStyle = '#c9a45c';
    ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#e7ddc9'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.name||'?', p.x, p.y-26);
  });

  // kendi karakterim
  if(state.alive){
    ctx.beginPath();
    ctx.fillStyle = state.role==='avci' ? '#e05b5b' : '#c9a45c';
    ctx.globalAlpha = state.crouching ? 0.6 : 1;
    ctx.arc(state.x, state.y, PLAYER_RADIUS, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // bakış yönü çizgisi
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(state.x, state.y);
    ctx.lineTo(state.x+Math.cos(state.facing)*26, state.y+Math.sin(state.facing)*26);
    ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText('ETKİSİZ HALE GETİRİLDİN', state.x, state.y-30);
  }

  ctx.restore();

  // basit vignette (atmosfer)
  const grad = ctx.createRadialGradient(
    window.innerWidth/2, window.innerHeight/2, window.innerHeight*0.25,
    window.innerWidth/2, window.innerHeight/2, window.innerHeight*0.75
  );
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,window.innerWidth,window.innerHeight);
}

/* =========================================================================
   10) BİTİŞ EKRANI
   ========================================================================= */
function showEndScreen(winner){
  if(rafId) cancelAnimationFrame(rafId);
  showScreen('game-screen'); // arkada kalsın, üstüne end-screen bindirilecek
  document.getElementById('end-screen').classList.remove('hidden');
  const title = document.getElementById('endTitle');
  const sub = document.getElementById('endSubtitle');
  if(winner === 'kacanlar'){
    title.textContent = 'KAÇANLAR KAZANDI'; title.className='end-title display win';
    sub.textContent = 'En az bir kaçan kütüphaneden çıkmayı başardı.';
  } else {
    title.textContent = 'AVCI KAZANDI'; title.className='end-title display lose';
    sub.textContent = 'Kaçanlar zamanında kaçamadı.';
  }
}

});
