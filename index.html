<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bütçem — Kişisel Finans Takibi</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#16213a; --text:#e2e8f0;
    --muted:#94a3b8; --primary:#22c55e; --primary-dark:#16a34a;
    --danger:#ef4444; --warn:#f59e0b; --info:#38bdf8; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:linear-gradient(135deg,#0f172a,#1e293b);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:860px;margin:0 auto}
  h1{text-align:center;font-size:1.6rem;margin:8px 0 4px}
  .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .card h2{font-size:1.05rem;margin-bottom:12px;border-bottom:1px solid #334155;padding-bottom:8px}
  label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 4px}
  input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:var(--card2);color:var(--text);font-size:.95rem;outline:none}
  input:focus{border-color:var(--primary)}
  input[type="date"]{color-scheme:dark}
  button{width:100%;padding:12px;margin-top:12px;border:none;border-radius:10px;background:var(--primary);color:#052e16;font-weight:700;font-size:1rem;cursor:pointer;transition:.15s}
  button:hover{background:var(--primary-dark);color:#fff}
  button.secondary{background:#334155;color:var(--text)}
  button.secondary:hover{background:#475569}
  button.cancel{background:#475569;color:var(--text);display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
  .stat .v{font-size:1.15rem;font-weight:700}
  .stat .l{font-size:.72rem;color:var(--muted);margin-top:4px}
  .bar-wrap{background:#0b1120;border-radius:8px;height:14px;overflow:hidden;margin:6px 0 14px}
  .bar{height:100%;border-radius:8px;transition:width .4s}
  .alert{padding:12px;border-radius:10px;margin-top:12px;font-size:.9rem;display:none}
  .alert.show{display:block}
  .alert.warn{background:rgba(245,158,11,.15);border:1px solid var(--warn);color:#fbbf24}
  .alert.danger{background:rgba(239,68,68,.15);border:1px solid var(--danger);color:#fca5a5}
  .alert.ok{background:rgba(34,197,94,.12);border:1px solid var(--primary);color:#86efac}
  .score-circle{width:130px;height:130px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;position:relative}
  .score-circle .num{font-size:2rem}
  .score-circle .of{font-size:.75rem;color:var(--muted)}
  .factor{display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0;border-bottom:1px dashed #334155}
  .factor span:last-child{font-weight:700}
  .payday{font-size:1.05rem;padding:10px;border-radius:10px;background:var(--card2);margin-top:8px;text-align:center}
  .payday.today{background:rgba(34,197,94,.2);border:2px solid var(--primary);color:#86efac;font-weight:700}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .tabs{display:flex;gap:8px;margin-top:16px}
  .tab{flex:1;padding:9px 4px;border-radius:8px;background:var(--card2);text-align:center;cursor:pointer;font-size:.8rem;color:var(--muted);border:1px solid #334155;user-select:none}
  .tab.active{background:var(--primary);color:#052e16;font-weight:700;border-color:var(--primary)}
  .list-total{text-align:center;font-size:.85rem;color:var(--muted);margin:12px 0 8px}
  .list-total b{color:var(--text)}
  .exp-item{background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .exp-item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .exp-item .date{font-weight:700;font-size:.88rem}
  .exp-item .total{font-weight:700;color:var(--primary);font-size:.95rem;white-space:nowrap}
  .exp-item .detail{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.5}
  .exp-item .actions{display:flex;gap:8px;margin-top:8px}
  .exp-item .actions button{width:auto;flex:1;padding:7px;font-size:.75rem;margin-top:0}
  .btn-edit{background:var(--info)!important;color:#04263c!important}
  .btn-del{background:var(--danger)!important;color:#fff!important}
  .empty{color:var(--muted);font-size:.85rem;text-align:center;padding:16px 0}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>💰 Bütçem</h1>
  <p class="sub">Kişisel finans takip ve finans puanı uygulaması</p>

  <!-- GELİR / BİRİKİM -->
  <div class="card">
    <h2>📥 Gelir & Birikim</h2>
    <label>Maaş (örn. 35000)</label>
    <input type="number" id="salary" placeholder="35000" />
    <div class="row">
      <div><label>Birikim</label><input type="number" id="savings" placeholder="5000" /></div>
      <div><label>Gelen Para</label><input type="number" id="incoming" placeholder="2000" /></div>
    </div>
    <label>Maaş Günü (ayın kaçında yatıyor?)</label>
    <input type="number" id="payday" min="1" max="31" placeholder="15" />
    <button onclick="saveIncome()">Kaydet</button>
    <div id="paydayInfo" class="payday" style="display:none"></div>
  </div>

  <!-- HARCAMALAR -->
  <div class="card">
    <h2>💸 Harcamalar</h2>
    <label>Tarih</label>
    <input type="date" id="expDate" />
    <div class="row">
      <div><label>🍔 Yemek</label><input type="number" id="food" placeholder="0" /></div>
      <div><label>🎉 Eğlence</label><input type="number" id="fun" placeholder="0" /></div>
    </div>
    <div class="row">
      <div><label>🏠 Kira</label><input type="number" id="rent" placeholder="0" /></div>
      <div><label>🚌 Ulaşım</label><input type="number" id="transport" placeholder="0" /></div>
    </div>
    <label>📦 Diğer</label>
    <input type="number" id="other" placeholder="0" />
    <button id="addExpBtn" onclick="addExpense()">Harcama Ekle</button>
    <button class="cancel" id="cancelEditBtn" onclick="cancelEdit()">İptal</button>
    <div id="spendAlert" class="alert"></div>

    <div class="tabs">
      <div class="tab" id="tab-week" onclick="setRange('week')">Haftalık</div>
      <div class="tab" id="tab-month" onclick="setRange('month')">Aylık</div>
      <div class="tab active" id="tab-all" onclick="setRange('all')">Tüm Zamanlar</div>
    </div>
    <div id="listTotal" class="list-total"></div>
    <div id="expList"></div>
  </div>

  <!-- HEDEF -->
  <div class="card">
    <h2>🎯 Hedef Belirleme</h2>
    <label>Hedef Tutarı (TL)</label>
    <input type="number" id="goal" placeholder="50000" />
    <label>Aylık ne kadar ayırabilirsin?</label>
    <input type="number" id="goalMonthly" placeholder="5000" />
    <button onclick="calcGoal()">Hedefi Hesapla</button>
    <div id="goalResult" style="margin-top:12px"></div>
  </div>

  <!-- BU AYI ATLATABİLİR MİYİM -->
  <div class="card">
    <h2>🧮 Bu Ayı Atlatabilir miyim?</h2>
    <label>Elindeki Para (örn. 40000 TL)</label>
    <input type="number" id="cash" placeholder="40000" />
    <label>Hangi Tarihe Kadar Yetmesi Lazım?</label>
    <input type="date" id="targetDate" />
    <button onclick="calcSurvival()">Hesapla</button>
    <div id="survivalResult" style="margin-top:12px"></div>
  </div>

  <!-- FİNANS PUANI -->
  <div class="card">
    <h2>📊 Finans Puanın</h2>
    <div class="score-circle" id="scoreCircle">
      <div class="num" id="scoreNum">--</div>
      <div class="of">/ 100</div>
    </div>
    <button onclick="calcScore()">Puanı Hesapla</button>
    <div id="scoreFactors" style="margin-top:12px"></div>
  </div>
</div>

<script>
const TL = n => (isNaN(n)?0:n).toLocaleString('tr-TR',{maximumFractionDigits:0}) + ' TL';
const val = id => parseFloat(document.getElementById(id).value) || 0;
const store = JSON.parse(localStorage.getItem('butceApp')||'{}');
let expenses = store.expenses || [];
let income = store.income || null;
let editingId = null;
let currentRange = 'all';

function save(){ localStorage.setItem('butceApp', JSON.stringify({expenses, income})); }

function todayStr(){ return new Date().toISOString().slice(0,10); }
function toDate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }

// Sayfa açılışında kayıtlı gelir varsa doldur
if(income){
  salary.value=income.salary; savings.value=income.savings;
  incoming.value=income.incoming; payday.value=income.payday;
  showPayday();
}
expDate.value = todayStr();

function saveIncome(){
  income = { salary:val('salary'), savings:val('savings'), incoming:val('incoming'), payday:parseInt(payday.value)||15 };
  save(); showPayday();
}

function showPayday(){
  if(!income) return;
  const today=new Date(), d=today.getDate(), pd=income.payday;
  let next=new Date(today.getFullYear(), today.getMonth(), pd);
  if(d>pd) next=new Date(today.getFullYear(), today.getMonth()+1, pd);
  const daysLeft=Math.ceil((next-today)/86400000);
  const el=document.getElementById('paydayInfo');
  el.style.display='block';
  el.classList.toggle('today', d===pd);
  el.textContent = d===pd
    ? '🎉 Bugün maaş günü! Maaşın bugün yatacak: '+TL(income.salary)
    : `📅 Maaşın her ayın ${pd}'inde yatıyor. Sonraki maaşa ${daysLeft} gün kaldı.`;
}

// ---- HARCAMALAR ----
function addExpense(){
  const d = expDate.value;
  if(!d){ alert('Lütfen tarih seçin.'); return; }
  const e={ date:d, food:val('food'), fun:val('fun'), rent:val('rent'), transport:val('transport'), other:val('other') };
  e.total=e.food+e.fun+e.rent+e.transport+e.other;
  if(e.total<=0){ alert('Lütfen harcama girin.'); return; }

  if(editingId){
    const idx = expenses.findIndex(x=>x.id===editingId);
    if(idx>-1){ e.id=editingId; expenses[idx]=e; }
    cancelEdit();
  } else {
    e.id = Date.now();
    expenses.push(e);
  }
  save();
  ['food','fun','rent','transport','other'].forEach(id=>document.getElementById(id).value='');
  expDate.value = todayStr();
  renderExpenses(); checkOverspending();
}

function editExpense(id){
  const e = expenses.find(x=>x.id===id);
  if(!e) return;
  expDate.value=e.date; food.value=e.food||''; fun.value=e.fun||'';
  rent.value=e.rent||''; transport.value=e.transport||''; other.value=e.other||'';
  editingId=id;
  document.getElementById('addExpBtn').textContent='Güncelle';
  document.getElementById('cancelEditBtn').style.display='block';
  window.scrollTo({top:document.getElementById('expDate').getBoundingClientRect().top+window.scrollY-20, behavior:'smooth'});
}

function cancelEdit(){
  editingId=null;
  document.getElementById('addExpBtn').textContent='Harcama Ekle';
  document.getElementById('cancelEditBtn').style.display='none';
  ['food','fun','rent','transport','other'].forEach(id=>document.getElementById(id).value='');
  expDate.value = todayStr();
}

function deleteExpense(id){
  if(!confirm('Bu harcama kaydını silmek istediğine emin misin?')) return;
  expenses = expenses.filter(x=>x.id!==id);
  if(editingId===id) cancelEdit();
  save(); renderExpenses(); checkOverspending();
}

function setRange(r){
  currentRange=r;
  ['week','month','all'].forEach(k=>document.getElementById('tab-'+k).classList.toggle('active', k===r));
  renderExpenses();
}

function filterByRange(list, range){
  if(range==='all') return list;
  const days = range==='week' ? 6 : 29; // dahil olmak üzere son 7 / 30 gün
  const today = todayStr();
  return list.filter(e => { const diff=daysBetween(e.date, today); return diff>=0 && diff<=days; });
}

function renderExpenses(){
  const listEl=document.getElementById('expList');
  const totalEl=document.getElementById('listTotal');
  const sorted=[...expenses].sort((a,b)=> a.date<b.date?1:-1);
  const filtered=filterByRange(sorted, currentRange);

  if(!filtered.length){
    totalEl.textContent='';
    listEl.innerHTML='<div class="empty">Bu aralıkta harcama kaydı yok.</div>';
    return;
  }
  const sum=filtered.reduce((s,e)=>s+e.total,0);
  const label = currentRange==='week' ? 'Son 7 gün toplamı' : currentRange==='month' ? 'Son 30 gün toplamı' : 'Tüm zamanlar toplamı';
  totalEl.innerHTML = `${label}: <b>${TL(sum)}</b> · ${filtered.length} kayıt`;

  listEl.innerHTML = filtered.map(e=>{
    const dateFmt = toDate(e.date).toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric',weekday:'short'});
    const parts=[];
    if(e.food) parts.push('🍔 '+TL(e.food));
    if(e.fun) parts.push('🎉 '+TL(e.fun));
    if(e.rent) parts.push('🏠 '+TL(e.rent));
    if(e.transport) parts.push('🚌 '+TL(e.transport));
    if(e.other) parts.push('📦 '+TL(e.other));
    return `<div class="exp-item">
      <div class="top"><span class="date">${dateFmt}</span><span class="total">${TL(e.total)}</span></div>
      <div class="detail">${parts.join(' &nbsp;·&nbsp; ')}</div>
      <div class="actions">
        <button class="btn-edit" onclick="editExpense(${e.id})">✏️ Düzelt</button>
        <button class="btn-del" onclick="deleteExpense(${e.id})">🗑️ Sil</button>
      </div>
    </div>`;
  }).join('');
}

// Son N günün toplam harcaması (varsayılan 30 gün, aylık kabul edilir)
function totalInLastDays(days){
  const today=todayStr();
  return expenses.reduce((s,e)=>{
    const diff=daysBetween(e.date, today);
    return (diff>=0 && diff<days) ? s+e.total : s;
  },0);
}
function monthlyExpenseTotal(){ return totalInLastDays(30); }

function checkOverspending(){
  const el=document.getElementById('spendAlert');
  if(!income || !expenses.length){ el.className='alert'; return; }
  const m=monthlyExpenseTotal(), s=income.salary;
  const ratio=s>0? m/s : 1;
  el.className='alert show '+(ratio>0.9?'danger':ratio>0.7?'warn':'ok');
  el.textContent = ratio>0.9
    ? `⚠️ DİKKAT! Son 30 gündeki harcaman (${TL(m)}) maaşının %${Math.round(ratio*100)}'ine ulaştı. Çok fazla harcama yapıyorsun, frene bas!`
    : ratio>0.7
    ? `⚠️ Uyarı: Son 30 gündeki harcaman (${TL(m)}) maaşının %${Math.round(ratio*100)}'i seviyesinde. Dikkatli ol.`
    : `✅ Son 30 gündeki harcaman (${TL(m)}) kontrol altında. Maaşının %${Math.round(ratio*100)}'ini harcıyorsun.`;
}

// ---- HEDEF ----
function calcGoal(){
  const g=val('goal'), m=val('goalMonthly'), el=document.getElementById('goalResult');
  if(g<=0||m<=0){ el.innerHTML='<p style="color:var(--danger)">Hedef ve aylık tutar girin.</p>'; return; }
  const months=Math.ceil(g/m);
  const target=new Date(); target.setMonth(target.getMonth()+months);
  el.innerHTML=`<div class="stat"><div class="v">${months} ay</div>
    <div class="l">Hedefe ulaşma süresi (~${target.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})})</div></div>`;
}

// ---- BU AYI ATLATABİLİR MİYİM ----
function calcSurvival(){
  const cash=val('cash'), el=document.getElementById('survivalResult');
  const targetVal = document.getElementById('targetDate').value;
  if(cash<=0){ el.innerHTML='<p style="color:var(--danger)">Para tutarı girin.</p>'; return; }
  if(!targetVal){ el.innerHTML='<p style="color:var(--danger)">Hangi tarihe kadar yetmesi gerektiğini seçin.</p>'; return; }

  const today=todayStr();
  const daysLeft = daysBetween(today, targetVal) + 1; // bugün dahil
  if(daysLeft<=0){ el.innerHTML='<p style="color:var(--danger)">Lütfen bugünden sonraki bir tarih seçin.</p>'; return; }

  const monthly=monthlyExpenseTotal();
  if(monthly<=0){
    el.innerHTML=`<div class="alert show ok">Harcama kaydın olmadığı için tahmin yapılamıyor. Önce günlük harcamalarını gir.</div>`; return;
  }
  const dailyNeed=monthly/30, need=dailyNeed*daysLeft;
  const ok=cash>=need;
  const dateFmt = toDate(targetVal).toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
  el.innerHTML=`<div class="grid2">
      <div class="stat"><div class="v">${TL(dailyNeed)}</div><div class="l">Günlük Ortalama İhtiyaç</div></div>
      <div class="stat"><div class="v">${TL(need)}</div><div class="l">${dateFmt} Tarihine Kadar Gereken (${daysLeft} gün)</div></div>
    </div>
    <div class="alert show ${ok?'ok':'danger'}" style="margin-top:12px">
      ${ok ? `✅ Evet! ${TL(cash)} ile ${dateFmt} tarihine kadar rahat idare edersin. O gün yaklaşık ${TL(cash-need)} elinde kalır.`
           : `❌ Hayır, ${TL(cash)} yetmez. ${dateFmt} tarihine kadar yaklaşık ${TL(need-cash)} daha gerekiyor. Günlük harcamayı ${TL(cash/daysLeft)} ile sınırlamalısın.`}
    </div>`;
}

// ---- FİNANS PUANI ----
function calcScore(){
  const el=document.getElementById('scoreFactors');
  if(!income||!income.salary){ el.innerHTML='<p style="color:var(--danger)">Önce maaş ve birikim bilgilerini kaydet.</p>'; return; }
  const s=income.salary, m=monthlyExpenseTotal();
  const sav=(income.savings+income.incoming);

  let balance = m<=s*0.6?20 : m<=s*0.8?15 : m<=s?10 : m<=s*1.2?5 : 0;
  let savRate = sav>=s*0.2?20 : sav>=s*0.1?14 : sav>0?8 : 0;
  let waste   = (()=>{ const fo=expenses.reduce((a,e)=>{
        const today=todayStr(); const diff=daysBetween(e.date,today);
        return (diff>=0&&diff<30) ? a+e.fun+e.other : a; },0);
      const r=s>0?fo/s:1; return r<=0.1?15 : r<=0.25?10 : 5; })();
  let goalFit = val('goal')>0 && sav>=val('goalMonthly')*0.8 ? 15 : val('goal')>0 ? 8 : 5;
  let budget  = m>0 && m<=s ? 15 : m===0 ? 8 : 5;
  let debt    = m>s ? 5 : 15;

  const total=Math.min(100, balance+savRate+waste+goalFit+budget+debt);
  document.getElementById('scoreNum').textContent=total;
  const c=total>=70?'var(--primary)':total>=45?'var(--warn)':'var(--danger)';
  document.getElementById('scoreCircle').style.background=
    `conic-gradient(${c} ${total*3.6}deg, #0b1120 0deg)`;
  el.innerHTML=`<p style="font-size:.8rem;color:var(--muted);margin-bottom:6px">Puanı etkileyen faktörler:</p>
    <div class="factor"><span>Gelir/gider dengesi</span><span>${balance}/20</span></div>
    <div class="factor"><span>Birikim oranı</span><span>${savRate}/20</span></div>
    <div class="factor"><span>Gereksiz harcama</span><span>${waste}/15</span></div>
    <div class="factor"><span>Hedeflere uyum</span><span>${goalFit}/15</span></div>
    <div class="factor"><span>Aylık bütçe</span><span>${budget}/15</span></div>
    <div class="factor"><span>Borç yükü</span><span>${debt}/15</span></div>
    <div class="alert show ${total>=70?'ok':total>=45?'warn':'danger'}" style="margin-top:12px">
      ${total>=70?'🎉 Harika! Finansal durumun sağlıklı görünüyor.':total>=45?'😐 Fena değil, ama birikimini artırıp gereksiz harcamaları kısabilirsin.':'⚠️ Finansal durumun riskli. Harcamalarını acilen gözden geçir!'}
    </div>`;
}

// Açılışta listeyi ve uyarıyı göster
renderExpenses(); checkOverspending();
</script>
</body>
</html>
