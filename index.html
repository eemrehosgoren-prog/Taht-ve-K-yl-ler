<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>SON DEVLET — Modern Devlet Yönetim Stratejisi</title>
<meta name="description" content="SON DEVLET: ülkeni kur, ekonomini büyüt, sanayi ve ordu geliştir, savunma hatları ör, diplomasi yap ve dünyada zirveye çık." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   SON DEVLET — Tek dosya prototip
   Bölümler: 1) Tema  2) Layout  3) Bileşenler  4) Ekranlar
   ========================================================= */
:root{
  --bg:#0a0e13; --bg2:#0f151d; --panel:#141c26; --panel2:#1b2531;
  --line:#25313f; --line2:#33414f;
  --txt:#e6eef7; --muted:#8ea0b5;
  --gold:#c8a24a; --gold2:#f0d18a;
  --steel:#4d7ea8; --ok:#4fbf87; --warn:#e0a83c; --bad:#d6544e;
  --r:14px; --tap:48px;
  --shadow:0 10px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #16202c 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 120%, #1a2536 0%, transparent 60%),
    var(--bg);
  color:var(--txt); font-family:Rajdhani,system-ui,sans-serif; font-size:15px;
  user-select:none; touch-action:manipulation;
}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Rajdhani,sans-serif; letter-spacing:.5px; margin:0}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hide{display:none !important}

/* -------- Rotate uyarısı -------- */
#rotate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#rotate .ph{width:74px;height:120px;border:3px solid var(--gold);border-radius:12px;animation:tilt 1.8s ease-in-out infinite}
@keyframes tilt{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:950px){ #rotate{display:flex} #app{display:none} }

/* -------- Layout -------- */
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:linear-gradient(180deg,#182231,#111924);border-bottom:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
.brand{display:flex;align-items:center;gap:8px;padding-right:10px;border-right:1px solid var(--line);margin-right:4px}
.crest{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--gold2),#8a6a24);
  display:grid;place-items:center;color:#20170a;font-weight:700;font-size:17px;flex:0 0 auto}
.brand b{font-family:'Barlow Condensed';font-size:19px;line-height:1;display:block}
.brand span{font-size:11px;color:var(--muted);display:block}
.res{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:5px 9px;min-width:max-content}
.chip i{font-style:normal;font-size:15px}
.chip .v{font-weight:700;font-variant-numeric:tabular-nums}
.chip .r{font-size:10px;color:var(--muted)}
.chip.pos .r{color:var(--ok)} .chip.neg .r{color:var(--bad)}

.main{flex:1;display:flex;min-height:0}
.nav{width:96px;flex:0 0 96px;display:flex;flex-direction:column;gap:5px;padding:8px 6px;overflow-y:auto;
  background:linear-gradient(180deg,#121a24,#0d131b);border-right:1px solid var(--line)}
.nav::-webkit-scrollbar{width:0}
.navb{min-height:var(--tap);border-radius:12px;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;transition:.18s}
.navb em{font-style:normal;font-size:19px}
.navb span{font-size:11px;font-weight:700;letter-spacing:.4px}
.navb:active{transform:scale(.95)}
.navb.on{border-color:var(--gold);
  background:linear-gradient(160deg,#26374a,#1c2836);box-shadow:0 0 0 1px rgba(200,162,74,.35), var(--shadow)}
.navb.on em{filter:drop-shadow(0 0 6px rgba(240,209,138,.6))}
.navb .badge{position:absolute}

.stage{flex:1;min-width:0;overflow-y:auto;padding:10px 12px 14px;scroll-behavior:smooth}
.stage::-webkit-scrollbar{width:6px}.stage::-webkit-scrollbar-thumb{background:#26323f;border-radius:9px}
.screen{animation:in .26s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* -------- Bileşenler -------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.hd h2{font-size:22px;text-transform:uppercase}
.hd p{margin:0;color:var(--muted);font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:11px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(200,162,74,.5),transparent)}
.card h3{font-size:16px;text-transform:uppercase}
.card .sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:13px}
.row b{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:8px 0}
.bar{height:8px;border-radius:6px;background:#0c1219;border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--steel),#6fb2dd);transition:width .5s}
.bar.gold > i{background:linear-gradient(90deg,#8a6a24,var(--gold2))}
.bar.ok > i{background:linear-gradient(90deg,#2f7a58,var(--ok))}
.bar.bad > i{background:linear-gradient(90deg,#7a2f2c,var(--bad))}
.btn{min-height:44px;border-radius:12px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-weight:700;font-size:14px;border:1px solid var(--line);background:linear-gradient(180deg,#243346,#1a2532);transition:.15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),#a5802f);color:#1a1305;border-color:#e2c68a}
.btn.ghost{background:#131b25}
.btn.danger{background:linear-gradient(180deg,#a5433d,#77302b);border-color:#c76a63}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.full{width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:38px;padding:0 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.tab.on{background:linear-gradient(180deg,#2b3d52,#1f2c3a);border-color:var(--gold);color:var(--gold2)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#0e151d;border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:#2c5a45}.tag.bad{color:var(--bad);border-color:#6a3230}.tag.gold{color:var(--gold2);border-color:#6d5624}

/* hero */
.hero{border-radius:16px;padding:14px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:linear-gradient(120deg,#16222f 0%,#101820 60%),radial-gradient(600px 200px at 80% 0%,rgba(200,162,74,.18),transparent)}
.hero .sky{position:absolute;inset:0;background:
  linear-gradient(180deg, rgba(77,126,168,.18), transparent 55%),
  repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 44px);pointer-events:none}
.sky2{position:absolute;left:0;right:0;bottom:0;height:56%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.5)),
  repeating-linear-gradient(90deg,#1d2b3a 0 18px, #17222e 18px 26px, transparent 26px 60px);
  clip-path:polygon(0 60%,6% 40%,12% 55%,20% 25%,28% 50%,36% 30%,46% 52%,56% 22%,64% 46%,74% 34%,84% 54%,92% 38%,100% 58%,100% 100%,0 100%);
  opacity:.9}
.hero .in{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:118px}
.flagbox{display:flex;align-items:center;gap:10px}
.flag{width:56px;height:38px;border-radius:6px;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px}

/* liste satırı */
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;
  background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:9px}
.ico{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:21px;
  background:#0e161f;border:1px solid var(--line)}
.item .t{font-weight:700;font-size:14.5px}
.item .d{font-size:11.5px;color:var(--muted)}

/* harita */
.mapwrap{height:330px;border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative;
  background:radial-gradient(700px 320px at 50% 40%,#16222e,#0b1119);cursor:grab;touch-action:none}
.mapwrap.drag{cursor:grabbing}
.mapin{position:absolute;width:1400px;height:900px;transform-origin:0 0;
  background-image:linear-gradient(rgba(77,126,168,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(77,126,168,.09) 1px,transparent 1px);
  background-size:60px 60px}
.land{position:absolute;left:120px;top:120px;width:1050px;height:600px;border-radius:44% 56% 40% 60%/50% 40% 60% 50%;
  background:linear-gradient(140deg,#22384a,#16232f);border:1px solid #35506a}
.land{border:1px solid #35506a; box-shadow:inset 0 0 80px rgba(0,0,0,.6)}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pin b{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(160deg,#23394d,#16222e);border:1px solid var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.pin span{font-size:10px;background:#0b1119cc;padding:1px 6px;border-radius:6px;border:1px solid var(--line)}
.pin:active b{transform:scale(.9)}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.mapctl .btn{min-height:40px;padding:0 12px}

/* bildirim */
.feed{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto}
.note{display:flex;gap:8px;align-items:flex-start;background:#0f1720;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.note em{font-style:normal;font-size:16px}
.note .x{font-size:12.5px;line-height:1.3}
.note .tm{font-size:10px;color:var(--muted)}

/* toast */
#toasts{position:fixed;right:12px;top:60px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.toast{background:linear-gradient(160deg,#1e2b3a,#141d27);border:1px solid var(--gold);border-radius:12px;
  padding:9px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:tin .3s ease;max-width:330px}
.toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,8,12,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(560px,96vw);max-height:86dvh;overflow-y:auto;background:linear-gradient(165deg,#1a2431,#121922);
  border:1px solid var(--gold);border-radius:18px;padding:14px;box-shadow:0 24px 60px rgba(0,0,0,.7);animation:pop .24s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.sheet h2{font-size:21px;text-transform:uppercase}
.close{position:absolute}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.opt{min-height:58px;border-radius:12px;border:1px solid var(--line);background:#101821;font-size:26px;display:grid;place-items:center}
.opt.on{border-color:var(--gold);background:#22303f}
input[type=text]{width:100%;min-height:46px;border-radius:12px;background:#0d141c;border:1px solid var(--line);
  color:var(--txt);padding:0 12px;font-size:16px;font-family:inherit;font-weight:700}
input[type=text]:focus{outline:none;border-color:var(--gold)}

/* misyon */
.quest{display:flex;align-items:center;gap:10px;background:#0f1720;border:1px solid var(--line);border-radius:12px;padding:9px}
.quest.done{border-color:#2c5a45;opacity:.6}
.chk{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.quest.done .chk{background:var(--ok);color:#08130d;border-color:var(--ok)}
</style>
</head>
<body>

<div id="rotate"><div class="ph"></div><h2>SON DEVLET</h2>
<p style="color:var(--muted);max-width:340px">En iyi oyun deneyimi için cihazınızı <b style="color:var(--gold2)">yatay</b> çevirin.</p></div>

<div id="app">
  <!-- ÜST KAYNAK BARI -->
  <div class="topbar">
    <div class="brand"><div class="crest">★</div><div><b id="tbName">SON DEVLET</b><span id="tbSub">Devlet Konseyi</span></div></div>
    <div class="res" id="resBar"></div>
    <button class="btn ghost" style="min-height:38px;padding:0 10px" id="btnSave">💾</button>
  </div>

  <div class="main">
    <nav class="nav" id="nav"></nav>
    <div class="stage" id="stage"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* =====================================================================
   SON DEVLET — Oyun motoru (Vanilla JS)
   Mimari:
     DATA    : statik tanımlar (binalar, teknoloji, birlikler, savunma)
     State   : oyuncu verisi (localStorage ile kalıcı)
     Engine  : tick / üretim / offline hesap
     UI      : ekran render fonksiyonları
   FIREBASE : Storage.save/load fonksiyonları Firestore ile birebir
              değiştirilebilir (aşağıda // [FIREBASE] işaretli noktalar).
   ===================================================================== */

/* ------------------------- 0. Yardımcılar ------------------------- */
const $  = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>Date.now();
function fmt(n){
  n=Math.floor(n);
  if(Math.abs(n)>=1e12) return (n/1e12).toFixed(2)+" T";
  if(Math.abs(n)>=1e9)  return (n/1e9).toFixed(2)+" Mr";
  if(Math.abs(n)>=1e6)  return (n/1e6).toFixed(2)+" M";
  if(Math.abs(n)>=1e4)  return (n/1e3).toFixed(1)+" B";
  return n.toLocaleString("tr-TR");
}
function fmtTime(ms){
  if(ms<=0) return "0sn";
  const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  return h?`${h}sa ${m}dk`: m?`${m}dk ${r}sn`:`${r}sn`;
}

/* ------------------------- 1. Statik veriler ------------------------- */
const FLAGS=["🦅","🐺","🦁","🐉","⚓","⚔️","🛡","🌙","☀️","⭐","🔱","🏔"];
const COLORS=["Çelik","Altın","Kızıl","Lacivert","Zümrüt","Gri"];

// Bina/tesis tanımları — her biri gerçek üretim yapar
const BUILDINGS={
  house:   {n:"Konut Bölgesi", i:"🏙", cat:"eco", base:{money:250000}, grow:1.55,
            desc:"Nüfus kapasitesi ve mutluluk sağlar.", eff:l=>`+${fmt(40000*l)} nüfus kapasitesi`},
  tax:     {n:"Vergi Dairesi", i:"🏛", cat:"eco", base:{money:400000}, grow:1.6,
            desc:"Vergi gelirini artırır.", eff:l=>`+${fmt(9000*l)} ₺/sn vergi`},
  farm:    {n:"Tarım Kombinası", i:"🌾", cat:"eco", base:{money:300000}, grow:1.5,
            desc:"Gıda üretir.", eff:l=>`+${fmt(9*l)} gıda/sn`},
  power:   {n:"Enerji Santrali", i:"⚡", cat:"eco", base:{money:520000,oil:200}, grow:1.6,
            desc:"Şebeke enerjisi üretir.", eff:l=>`+${18*l} enerji kapasitesi`},
  port:    {n:"Ticaret Limanı", i:"⚓", cat:"eco", base:{money:900000}, grow:1.65,
            desc:"İhracat geliri sağlar.", eff:l=>`+${fmt(16000*l)} ₺/sn ihracat`},
  oilfield:{n:"Petrol Sahası", i:"🛢", cat:"ind", base:{money:700000}, grow:1.6,
            desc:"Ham petrol çıkarır.", eff:l=>`+${(2.2*l).toFixed(1)} varil/sn`},
  refinery:{n:"Rafineri", i:"🏗", cat:"ind", base:{money:1200000,oil:400}, grow:1.62,
            desc:"Petrolü yakıta ve gelire çevirir.", eff:l=>`+${fmt(22000*l)} ₺/sn rafinaj`},
  factory: {n:"Genel Sanayi", i:"🏭", cat:"ind", base:{money:800000}, grow:1.6,
            desc:"Sanayi üretim gücü — birlik üretimini hızlandırır.", eff:l=>`+%${5*l} üretim hızı`},
  aircraft:{n:"Uçak Fabrikası", i:"✈️", cat:"ind", base:{money:2200000,oil:600}, grow:1.7,
            desc:"Hava aracı üretimini açar ve ucuzlatır.", eff:l=>`-%${Math.min(40,4*l)} uçak maliyeti`},
  defind:  {n:"Savunma Fabrikası", i:"🛡", cat:"ind", base:{money:1800000}, grow:1.68,
            desc:"Savunma sistemi kurulumunu ucuzlatır.", eff:l=>`-%${Math.min(40,4*l)} savunma maliyeti`},
  missile: {n:"Füze Fabrikası", i:"🚀", cat:"ind", base:{money:2600000,oil:800}, grow:1.72,
            desc:"Füze üretimini açar.", eff:l=>`-%${Math.min(40,4*l)} füze maliyeti`},
  vehicle: {n:"Araç Fabrikası", i:"⚙️", cat:"ind", base:{money:1500000}, grow:1.66,
            desc:"Kara aracı üretimini ucuzlatır.", eff:l=>`-%${Math.min(40,4*l)} zırhlı maliyeti`}
};

// Teknoloji ağacı
const TECH={
  t_tax:   {n:"Dijital Vergilendirme", cat:"EKONOMİ", i:"💳", cost:1500000, sec:60,  req:[],        lvl:1, desc:"Vergi geliri +%25"},
  t_bank:  {n:"Merkez Bankacılığı",    cat:"EKONOMİ", i:"🏦", cost:4200000, sec:180, req:["t_tax"], lvl:3, desc:"Tüm gelir +%15"},
  t_trade: {n:"Serbest Ticaret",       cat:"EKONOMİ", i:"🚢", cost:7800000, sec:300, req:["t_bank"],lvl:5, desc:"İhracat +%30"},
  t_ind:   {n:"Ağır Sanayi",           cat:"EKONOMİ", i:"🏭", cost:9500000, sec:360, req:["t_bank"],lvl:6, desc:"Üretim hızı +%20"},

  t_armor: {n:"Kompozit Zırh",         cat:"ORDU",    i:"🛞", cost:5000000, sec:210, req:[],        lvl:3, desc:"Kara birlikleri savunma +%20"},
  t_jet:   {n:"Jet Motoru MK-II",      cat:"ORDU",    i:"✈️", cost:8800000, sec:330, req:["t_armor"],lvl:5,desc:"Hava birlikleri saldırı +%20"},
  t_navy:  {n:"Modern Deniz Platformu",cat:"ORDU",    i:"⚓", cost:12000000,sec:420, req:["t_jet"], lvl:8, desc:"Deniz birlikleri +%25"},

  t_ms1:   {n:"Kısa Menzil Füze",      cat:"FÜZE",    i:"🚀", cost:6000000, sec:240, req:[],        lvl:4, desc:"Kısa menzil füze üretimi"},
  t_ms2:   {n:"Orta Menzil Füze",      cat:"FÜZE",    i:"🎯", cost:11000000,sec:400, req:["t_ms1"], lvl:7, desc:"Orta menzil füze üretimi"},
  t_ms3:   {n:"Uzun Menzil Füze",      cat:"FÜZE",    i:"☄️", cost:19000000,sec:600, req:["t_ms2"], lvl:11,desc:"Uzun menzil füze üretimi"},

/* ------------------------- 3. Motor ------------------------- */
const Engine={
  lvl(k){ return S.buildings[k]||0; },
  costOf(key, lvl){
    const b=BUILDINGS[key], m=Math.pow(b.grow, lvl), c={};
    for(const k in b.base) c[k]=Math.floor(b.base[k]*m);
    return c;
  },
  // Üretim hızları (saniye başına)
  rates(){
    const b=S.buildings, t=S.tech;
    const has=id=>t.includes(id);
    let tax = 4000 + 9000*(b.tax||0) + S.population/4000;
    if(has("t_tax")) tax*=1.25;
    let exp = 16000*(b.port||0);
    if(has("t_trade")) exp*=1.30;
    let ref = 22000*(b.refinery||0);
    let money = tax+exp+ref;
    if(has("t_bank")) money*=1.15;
    money *= (0.55 + S.happy/100*0.65);        // mutluluk gelir çarpanı
    const upkeep = this.upkeep();
    const oil = 1.0 + 2.2*(b.oilfield||0) - 0.25*(b.refinery||0);
    const food = 6 + 9*(b.farm||0) - S.population/900000;
    return {money:money-upkeep, gross:money, upkeep, oil, food};
  },
  upkeep(){
    let u=0;
    for(const k in S.units) u += (UNITS[k]?.mt||0)*S.units[k];
    for(const k in S.defs)  u += (DEFS[k]?.mt||0)*S.defs[k];
    for(const k in S.buildings) u += 1200*S.buildings[k];
    return u;
  },
  energyCap(){ return 40 + 18*(S.buildings.power||0); },
  energyLoad(){
    let l=6;
    for(const k in S.buildings) l += 3*S.buildings[k];
    for(const k in S.defs) l += 2*S.defs[k];
    return l;
  },
  energyPct(){ return clamp(Math.round(100 - (this.energyLoad()/this.energyCap())*100 + 0), -100, 100); },
  popCap(){ return 800000 + 40000*(S.buildings.house||0)*10; },
  military(){
    let p=0;
    for(const k in S.units){ const u=UNITS[k]; if(u) p += (u.atk+u.def)*S.units[k]; }
    for(const k in S.defs){ const d=DEFS[k]; if(d) p += (d.pow+d.det/2)*S.defs[k]; }
    // teknoloji bonusları
    if(S.tech.includes("t_armor")) p*=1.08;
    if(S.tech.includes("t_jet")) p*=1.10;
    if(S.tech.includes("t_navy")) p*=1.10;
    return Math.floor(p);
  },
  ecoScore(){ return Math.floor(this.rates().gross/1000 + (S.money/1e6)); },
  ecoLabel(){ const v=this.ecoScore(); return v>9000?"Süper Güç":v>4000?"Çok Güçlü":v>1500?"Güçlü":v>600?"Orta":"Zayıf"; },
  milLabel(){ const v=this.military(); return v>200000?"Süper Güç":v>60000?"Çok Güçlü":v>15000?"Güçlü":v>4000?"Orta":"Zayıf"; },
  prodSpeed(){ let s=1 + 0.05*(S.buildings.factory||0); if(S.tech.includes("t_ind")) s*=1.2; return s; },
  unitCost(k){
    const u=UNITS[k]; let c=u.up;
    if(u.fac) c *= (1 - Math.min(0.4, 0.04*(S.buildings[u.fac]||0)));
    return Math.floor(c);
  },
  defCost(k){ return Math.floor(DEFS[k].cost * (1 - Math.min(0.4, 0.04*(S.buildings.defind||0)))); },
  canPay(c){ return (!c.money||S.money>=c.money) && (!c.oil||S.oil>=c.oil) && (!c.food||S.food>=c.food); },
  pay(c){ if(c.money)S.money-=c.money; if(c.oil)S.oil-=c.oil; if(c.food)S.food-=c.food; },
  give(c){ if(c.money)S.money+=c.money; if(c.oil)S.oil+=c.oil; if(c.food)S.food+=c.food; },

  // Ana tick — dt saniye
  tick(dt, silent){
    const r=this.rates();
    S.money = Math.max(0, S.money + r.money*dt);
    S.oil   = Math.max(0, S.oil   + r.oil*dt);
    S.food  = S.food + r.food*dt;

    // Gıda krizi & mutluluk
    let target = 60 + (S.buildings.house||0)*2 + (S.food>0?8:-30) + (this.energyPct()>10?6:-18);
    target -= Math.max(0,(S.population - this.popCap())/this.popCap()*40);
    target = clamp(target, 5, 98);
    S.happy += (target - S.happy) * clamp(dt/120,0,1);
    S.happy = clamp(S.happy, 1, 100);
    if(S.food<0){ S.food=0; S.population -= S.population*0.00002*dt; }

    // Nüfus
    const room = this.popCap() - S.population;
    const growth = room>0 ? S.population*0.00002*(S.happy/70)*dt : -S.population*0.00001*dt;
    S.population = Math.max(50000, S.population + growth);

    // Araştırma
    if(S.research && now()>=S.research.end){
      const id=S.research.id; S.tech.push(id); S.research=null;
      S.techLevel++; S.rep+=120;
      note("🔬","Araştırma tamamlandı: "+TECH[id].n, silent);
    }
    // Üretim kuyruğu
    if(S.prod.length){
      const done=S.prod.filter(p=>now()>=p.end);
      if(done.length){
        done.forEach(p=>{
          S.units[p.key]=(S.units[p.key]||0)+p.qty;
          note("🏭",`${UNITS[p.key].n} x${p.qty} envantere alındı.`, silent);
        });
        S.prod=S.prod.filter(p=>now()<p.end);
      }
    }
    checkQuests(silent);
  },
  offline(){
    const dt = clamp((now()-S.last)/1000, 0, 8*3600); // en fazla 8 saat (denge)
    if(dt>60){
      const before=S.money;
      this.tick(dt, true);
      return {dt, gain:S.money-before};
    }
    this.tick(dt, true);
    return null;
  }
};

/* Bildirim & toast */
function note(icon, text, silent){
  S.notes.unshift({i:icon, x:text, t:now()});
  if(S.notes.length>40) S.notes.length=40;
  if(!silent) toast(text);
  if(UI.current==="home") renderFeed();
}
function toast(text, kind){
  const t=el("div","toast"+(kind?" "+kind:""), text);
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition=".3s"; t.style.opacity=0; t.style.transform="translateX(30px)";
    setTimeout(()=>t.remove(),320); }, 2600);
}

/* Görev kontrolü */
function checkQuests(silent){
  QUESTS.forEach(q=>{
    if(!S.quests[q.id] && q.chk(S)){
      S.quests[q.id]=true; Engine.give(q.rw);
      note("🎖","Görev tamamlandı: "+q.t+" (+"+fmt(q.rw.money)+" ₺)", silent);
    }
  });
}

    c.innerHTML=`<div style="font-size:26px">${v.i}</div><h3>${v.n}</h3>
      <div class="sub">${homeHint(v.k)}</div>`;
    c.onclick=()=>UI.go(v.k);
    g.appendChild(c);
  });
  p.appendChild(g);

  const bottom=el("div","grid g2"); bottom.style.marginTop="10px";
  const nc=el("div","card",`<h3>📡 Bildirim Merkezi</h3><div class="hr"></div><div class="feed" id="feed"></div>`);
  const qs=QUESTS.filter(q=>!S.quests[q.id]).slice(0,3);
  const qc=el("div","card",`<h3>🎖 Aktif Görevler</h3><div class="hr"></div>`+
    (qs.length?qs.map(q=>`<div class="quest" style="margin-bottom:6px"><div class="chk">›</div>
      <div><div class="t" style="font-weight:700">${q.t}</div><div class="sub">${q.d}</div></div></div>`).join("")
    :`<div class="sub">Tüm görevler tamamlandı, komutanım.</div>`));
  bottom.appendChild(nc); bottom.appendChild(qc);
  p.appendChild(bottom);
  renderFeed();
}
function homeHint(k){
  switch(k){
    case "state": return `Nüfus ${fmt(S.population)} • Mutluluk %${Math.round(S.happy)}`;
    case "eco": return `Brüt gelir ${fmt(Engine.rates().gross)} ₺/sn`;
    case "ind": return `${Object.values(S.buildings).reduce((a,b)=>a+b,0)} tesis seviyesi`;
    case "tech": return S.research?`Araştırma sürüyor: ${TECH[S.research.id].n}`:`${S.tech.length} teknoloji tamam`;
    case "army": return `${Object.values(S.units).reduce((a,b)=>a+b,0)} birlik envanterde`;
    case "def": return `${Object.values(S.defs).reduce((a,b)=>a+b,0)} savunma sistemi`;
    case "map": return `${MAPSITES.length} tesis haritada`;
    case "world": return `${WORLD.length} ülke ile temas`;
  }
  return "";
}

function battlePanel(p){

  const g=el("div","grid g2");
  own.forEach(k=>{
    const u=UNITS[k], sel=battleSel[k]||0;
    const row=el("div","item");
    row.innerHTML=`<div class="ico">${u.i}</div>
      <div><div class="t">${u.n}</div><div class="d">Envanter ${S.units[k]} • Seçili <b class="s">${sel}</b></div></div>
      <div style="display:flex;gap:6px"><button class="btn ghost m">−</button><button class="btn p">+</button></div>`;
    row.querySelector(".p").onclick=()=>{ battleSel[k]=clamp((battleSel[k]||0)+1,0,S.units[k]); render(); };
    row.querySelector(".m").onclick=()=>{ battleSel[k]=clamp((battleSel[k]||0)-1,0,S.units[k]); render(); };
    g.appendChild(row);
  });
  c.appendChild(g);

  const targets=[
    {n:"Düşman Hava Üssü", i:"✈️", d:1.0, loot:{money:6e6, oil:600}},
    {n:"Fabrika Bölgesi",  i:"🏭", d:0.8, loot:{money:9e6}},
    {n:"Petrol Tesisi",    i:"🛢", d:0.9, loot:{money:3e6, oil:2200}},
    {n:"Radar İstasyonu",  i:"📡", d:0.6, loot:{money:2e6}},
    {n:"Askeri Üs",        i:"🎖", d:1.3, loot:{money:12e6, oil:900}}
  ];
  const tg=el("div","grid g3"); tg.style.marginTop="10px";
  targets.forEach(t=>{
    const b=el("button","card");
    b.innerHTML=`<div style="font-size:24px">${t.i}</div><h3 style="font-size:14px">${t.n}</h3>
      <div class="sub">Zorluk x${t.d} • Ganimet ${fmt(t.loot.money)} ₺${t.loot.oil?" + "+fmt(t.loot.oil)+" 🛢":""}</div>`;
    b.onclick=()=>runBattle(t);
    tg.appendChild(b);
  });
  c.appendChild(tg);
  p.appendChild(c);

function runBattle(t){
  const keys=Object.keys(battleSel).filter(k=>battleSel[k]>0);
  if(!keys.length) return toast("Önce birlik seçin.","bad");
  let atk=0, fuel=0;
  keys.forEach(k=>{ atk += UNITS[k].atk*battleSel[k]; fuel += UNITS[k].fuel*battleSel[k]*12; });
  if(S.oil<fuel) return toast(`Yakıt yetersiz (${Math.ceil(fuel)} varil gerek).`,"bad");
  S.oil-=fuel;
  const enemy = atk*t.d*(0.6+Math.random()*0.7);
  const ratio = atk/(atk+enemy);
  const win = ratio>0.5;
  const lossRate = clamp((1-ratio)*0.6, 0.02, 0.6);
  const losses={};
  keys.forEach(k=>{
    const l = Math.min(battleSel[k], Math.round(battleSel[k]*lossRate + (Math.random()<lossRate?1:0)));
    if(l>0){ losses[k]=l; S.units[k]-=l; }
  });
  let loot={money:0,oil:0};
  if(win){ loot.money=Math.floor(t.loot.money*(0.6+ratio)); loot.oil=Math.floor((t.loot.oil||0)*(0.6+ratio));
    S.money+=loot.money; S.oil+=loot.oil; S.rep+=180; S.happy=clamp(S.happy+4,1,100); }
  else { S.rep=Math.max(0,S.rep-90); S.happy=clamp(S.happy-6,1,100); }
  battleSel={};
  note(win?"⚔️":"💢", win?`Harekât başarılı: ${t.n} vuruldu.`:`Harekât başarısız: ${t.n} savunuldu.`);
  openModal(`
    <h2 style="color:${win?'var(--ok)':'var(--bad)'}">${win?"HAREKÂT BAŞARILI":"HAREKÂT BAŞARISIZ"}</h2>
    <div class="sub">${t.i} ${t.n}</div><div class="hr"></div>
    <div class="row"><span>Başarı oranı</span><b>%${Math.round(ratio*100)}</b></div>
    <div class="row"><span>Harcanan yakıt</span><b>${Math.ceil(fuel)} varil</b></div>
    <div class="row"><span>Toplam saldırı gücü</span><b>${fmt(atk)}</b></div>
    <div class="hr"></div><div class="sub">KAYIPLAR</div>
    ${Object.keys(losses).length?Object.keys(losses).map(k=>`<div class="row"><span>${UNITS[k].i} ${UNITS[k].n}</span><b style="color:var(--bad)">-${losses[k]}</b></div>`).join(""):`<div class="row"><span>Kayıp yok</span><b class="tag ok">✔</b></div>`}
    <div class="hr"></div><div class="sub">GANİMET</div>
    <div class="row"><span>Para</span><b style="color:${loot.money?'var(--ok)':'var(--muted)'}">+${fmt(loot.money)} ₺</b></div>
    <div class="row"><span>Petrol</span><b style="color:${loot.oil?'var(--ok)':'var(--muted)'}">+${fmt(loot.oil)} varil</b></div>
    <div class="row"><span>İtibar</span><b>${win?"+180":"-90"}</b></div>
  `);
  render();
}

/* SAVUNMA */
function scDef(p){
  head(p,"SAVUNMA","Radar ağı, hava ve füze savunma sistemleri");
  const brs=["RADAR","HAVA SAVUNMA","FÜZE SAVUNMA"];
  let cover=0; for(const k in S.defs) cover += (DEFS[k].det)*S.defs[k];
  const top=el("div","card");
  top.innerHTML=`<h3>📡 Hava Sahası Durumu</h3>
    <div class="bar gold" style="margin:8px 0"><i style="width:${clamp(cover/4,0,100)}%"></i></div>
    <div class="sub">Tespit kapsamı: %${Math.round(clamp(cover/4,0,100))} • Aktif sistem: ${Object.values(S.defs).reduce((a,b)=>a+b,0)}</div>`;
  p.appendChild(top);
  brs.forEach(br=>{
    const c=el("div","card"); c.style.marginTop="10px";
    c.innerHTML=`<h3>${br}</h3><div class="hr"></div>`;
    const g=el("div","grid g2");
    Object.keys(DEFS).filter(k=>DEFS[k].br===br).forEach(k=>{
      const d=DEFS[k], have=S.defs[k]||0, cost=Engine.defCost(k), locked=d.req&&!S.tech.includes(d.req);
      const row=el("div","item");
      row.innerHTML=`<div class="ico">${d.i}</div>
        <div><div class="t">${d.n} <span class="tag ${have?'gold':''}">x${have}</span></div>
        <div class="d">Menzil ${d.rng} km • Tespit ${d.det} • Savunma ${d.pow} • Mühimmat ${d.ammo}</div>
        <div class="d">Maliyet ${fmt(cost)} ₺ • Bakım ${fmt(d.mt)} ₺/sn${locked?` • <span style="color:var(--bad)">Gerekli: ${TECH[d.req].n}</span>`:""}</div></div>
        <div><button class="btn ${(!locked&&S.money>=cost)?'primary':''}" ${(!locked&&S.money>=cost)?"":"disabled"}>KUR</button></div>`;
      row.querySelector("button").onclick=()=>{
        if(S.money<cost) return toast("Bütçe yetersiz.","bad");
        S.money-=cost; S.defs[k]=have+1; S.rep+=25;
        note(d.i,`${d.n} konuşlandırıldı.`); render();
      };
      g.appendChild(row);
    });
    c.appendChild(g); p.appendChild(c);
  });
}

/* HARİTA */
let mapT={x:-140,y:-90,s:.75};
function scMap(p){
  head(p,"HARİTA","Parmağınızla sürükleyin • tesise dokunun");
  const wrap=el("div","mapwrap");
  const inn=el("div","mapin");
  inn.appendChild(el("div","land"));
  MAPSITES.forEach(s=>{
    const pin=el("div","pin",`<b>${s.i}</b><span>${s.n}</span>`);
    pin.style.left=s.x+"px"; pin.style.top=s.y+"px";
    pin.onclick=(e)=>{ e.stopPropagation(); siteInfo(s); };
    inn.appendChild(pin);
  });
  wrap.appendChild(inn);
  const ctl=el("div","mapctl",`<button class="btn ghost" data-z="-1">−</button><button class="btn ghost" data-z="1">+</button><button class="btn" data-z="0">⌖</button>`);
  wrap.appendChild(ctl);
  p.appendChild(wrap);

  const apply=()=>{ inn.style.transform=`translate(${mapT.x}px,${mapT.y}px) scale(${mapT.s})`; };
  apply();
  ctl.querySelectorAll("button").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const z=+b.dataset.z;
    if(z===0){ mapT={x:-140,y:-90,s:.75}; } else { mapT.s=clamp(mapT.s+z*0.15,0.4,1.8); }
    apply();
  });
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  const down=e=>{ drag=true; wrap.classList.add("drag"); const t=e.touches?e.touches[0]:e; sx=t.clientX;sy=t.clientY;ox=mapT.x;oy=mapT.y; };
  const move=e=>{ if(!drag)return; const t=e.touches?e.touches[0]:e;
    mapT.x=ox+(t.clientX-sx); mapT.y=oy+(t.clientY-sy); apply(); e.preventDefault(); };
  const up=()=>{ drag=false; wrap.classList.remove("drag"); };
  wrap.addEventListener("mousedown",down); wrap.addEventListener("touchstart",down,{passive:true});
  window.addEventListener("mousemove",move); wrap.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("mouseup",up); wrap.addEventListener("touchend",up);

  const legend=el("div","grid g4"); legend.style.marginTop="10px";
  [["🏙","Şehirler"],["🏭","Fabrikalar"],["🛢","Petrol"],["✈️","Hava Üsleri"],["⚓","Limanlar"],["🛡","Savunma"],["📡","Radarlar"],["🎯","Harekât"]]
    .forEach(l=>legend.appendChild(el("div","card",`<div style="font-size:22px">${l[0]}</div><div class="sub">${l[1]}</div>`)));
  p.appendChild(legend);
}
function siteInfo(s){
  let extra="";
  if(s.id==="a1"){
    const jets=["k01","k02","k03","uav"].filter(k=>S.units[k]>0);
    extra = `<div class="hr"></div><div class="sub">KONUŞLANDIRILMIŞ HAVA ARAÇLARI</div>`+
      (jets.length?jets.map(k=>`<div class="row"><span>${UNITS[k].i} ${UNITS[k].n}</span><b>x${S.units[k]}</b></div>`).join("")
      :`<div class="row"><span>Filo boş</span><b class="tag bad">—</b></div>`);
  }
  if(s.id==="o1") extra=`<div class="hr"></div><div class="row"><span>Petrol sahası seviyesi</span><b>${S.buildings.oilfield||0}</b></div>
    <div class="row"><span>Üretim</span><b>${(2.2*(S.buildings.oilfield||0)).toFixed(1)} varil/sn</b></div>`;
  if(s.id==="d1"){ const n=Object.keys(S.defs).filter(k=>DEFS[k].br!=="RADAR");
    extra=`<div class="hr"></div>`+(n.length?n.map(k=>`<div class="row"><span>${DEFS[k].i} ${DEFS[k].n}</span><b>x${S.defs[k]}</b></div>`).join(""):`<div class="sub">Bu hatta sistem konuşlu değil.</div>`); }
  openModal(`<h2>${s.i} ${s.n}</h2><div class="sub">${s.t} • Seviye ${1+Math.floor((S.techLevel)/4)}</div>
    <div class="hr"></div><div class="sub">${s.info}</div>${extra}`);
}

/* DÜNYA & DİPLOMASİ */
function scWorld(p){
  if(!S.flags.exploredWorld){ S.flags.exploredWorld=true; checkQuests(); }
  head(p,"DÜNYA","Sıralama, diplomasi ve ittifaklar");
  const me={n:S.country, f:S.flag, pw:Engine.military(), rep:S.rep, al:S.alliance||"—", me:true};
  const list=[...WORLD, me].sort((a,b)=>b.pw-a.pw);
  const c=el("div","card");
  c.innerHTML=`<h3>🌍 Dünya Sıralaması</h3><div class="hr"></div>`;
  const g=el("div","grid g2");
  list.forEach((w,i)=>{
    const row=el("div","item");
    row.style.borderColor = w.me?"var(--gold)":"var(--line)";
    row.innerHTML=`<div class="ico">${w.f}</div>
      <div><div class="t">#${i+1} ${w.n} ${w.me?'<span class="tag gold">SİZ</span>':''}</div>
      <div class="d">Güç ${fmt(w.pw)} • İtibar ${fmt(w.rep)} • İttifak: ${w.al}</div>
      <div class="d">${w.me?"Kendi devletiniz":"İlişki: "+(S.diplo[w.n]||"Tarafsız")}</div></div>
      <div>${w.me?'<span class="tag">—</span>':'<button class="btn">DİPLOMASİ</button>'}</div>`;
    const b=row.querySelector("button"); if(b) b.onclick=()=>diploModal(w);
    g.appendChild(row);
  });
  c.appendChild(g); p.appendChild(c);

  const al=el("div","card"); al.style.marginTop="10px";
  al.innerHTML=`<h3>🤝 İttifak</h3><div class="hr"></div>
    <div class="sub">${S.alliance?`Üyesi olduğunuz ittifak: <b style="color:var(--gold2)">${S.alliance}</b>`:"Henüz bir ittifaka üye değilsiniz."}</div>`;
  const g2=el("div","grid g3"); g2.style.marginTop="8px";
  ["KUZEY PAKTI","DENİZ BİRLİĞİ","DOĞU BLOĞU"].forEach(a=>{
    const b=el("button","btn"+(S.alliance===a?" primary":"")); b.textContent=a;
    b.onclick=()=>{ if(S.alliance===a){ S.alliance=null; note("🤝","İttifaktan ayrıldınız."); }
      else { S.alliance=a; S.rep+=150; note("🤝",`${a} ittifakına katıldınız.`); } render(); };
    g2.appendChild(b);
  });
  al.appendChild(g2); p.appendChild(al);
}
function diploModal(w){
  const acts=[
    {n:"Barış Anlaşması", i:"🕊", r:"Barış", rep:60, cost:1e6},
    {n:"Saldırmazlık Anlaşması", i:"📜", r:"Saldırmazlık", rep:90, cost:2.5e6},
    {n:"Ticaret Anlaşması", i:"💱", r:"Ticaret Ortağı", rep:70, cost:4e6, gain:true},
    {n:"Savunma Anlaşması", i:"🛡", r:"Müttefik", rep:150, cost:8e6},
    {n:"Savaş İlanı", i:"⚔️", r:"Savaş", rep:-120, cost:0}
  ];
  openModal(`<h2>${w.f} ${w.n}</h2><div class="sub">Güç ${fmt(w.pw)} • İtibar ${fmt(w.rep)} • İttifak ${w.al}</div>
    <div class="hr"></div><div class="sub">Mevcut ilişki: <b>${S.diplo[w.n]||"Tarafsız"}</b></div><div class="hr"></div>
    <div id="dipActs" class="grid"></div>`);
  const box=$("#dipActs");
  acts.forEach(a=>{
    const b=el("button","item");
    b.innerHTML=`<div class="ico">${a.i}</div><div><div class="t">${a.n}</div>
      <div class="d">${a.cost?fmt(a.cost)+" ₺ • ":""}İtibar ${a.rep>0?"+":""}${a.rep}</div></div><div class="tag">SEÇ</div>`;
    b.onclick=()=>{
      if(a.cost && S.money<a.cost) return toast("Bütçe yetersiz.","bad");
      S.money-=a.cost; S.rep=Math.max(0,S.rep+a.rep); S.diplo[w.n]=a.r;
      if(a.gain){ const g=Math.floor(2e6+Math.random()*5e6); S.money+=g; note("💰",`${w.n} ticaretinden +${fmt(g)} ₺`); }
      note(a.i, `${w.n} ile ${a.n.toLowerCase()} kuruldu.`);
      closeModal(); render();
    };
    box.appendChild(b);
  });
}

/* GÖREVLER */
function scQuest(p){
  head(p,"GÖREVLER","İlerledikçe yeni sistemler açılır");
  const c=el("div","card");
  const g=el("div","grid");
  QUESTS.forEach(q=>{
    const done=!!S.quests[q.id];
    g.appendChild(el("div","quest"+(done?" done":""),
      `<div class="chk">${done?"✔":"›"}</div>
       <div style="flex:1"><div style="font-weight:700">${q.t}</div><div class="sub">${q.d}</div></div>
       <div class="tag gold">+${fmt(q.rw.money)} ₺${q.rw.oil?` • ${q.rw.oil} 🛢`:""}</div>`));
  });
  c.appendChild(g); p.appendChild(c);
}

/* ------------------------- 5. Modal ------------------------- */
function openModal(html, opts){
  const m=el("div","modal");
  const sh=el("div","sheet",html);
  if(!opts||!opts.noClose){
    const b=el("button","btn full"); b.textContent="KAPAT"; b.style.marginTop="12px";
    b.onclick=closeModal; sh.appendChild(b);
    m.onclick=e=>{ if(e.target===m) closeModal(); };
  }
  m.appendChild(sh); $("#modalRoot").appendChild(m);
  return sh;
}
function closeModal(){ $("#modalRoot").innerHTML=""; }

/* ------------------------- 6. Kurulum akışı ------------------------- */
function setupFlow(){
  let flag=FLAGS[0], name="";
  const sh=openModal(`
    <h2>SON DEVLET</h2>
    <div class="sub">Yeni bir devlet kuruyorsunuz, sayın lider. Devletinizin adını ve sancağını belirleyin.</div>
    <div class="hr"></div>
    <div class="sub" style="margin-bottom:6px">DEVLET ADI</div>
    <input type="text" id="cn" maxlength="22" placeholder="Örn. ANADOLU FEDERASYONU" />
    <div class="sub" style="margin:12px 0 6px">SANCAK</div>
    <div class="opts" id="flags"></div>
    <div class="hr"></div>
    <button class="btn primary full" id="startBtn">DEVLETİ KUR</button>
  `,{noClose:true});
  const fb=sh.querySelector("#flags");
  FLAGS.forEach((f,i)=>{
    const b=el("button","opt"+(i===0?" on":""),f);
    b.onclick=()=>{ flag=f; fb.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
    fb.appendChild(b);
  });
  sh.querySelector("#startBtn").onclick=()=>{
    name=(sh.querySelector("#cn").value||"").trim().toUpperCase();
    if(name.length<3) return toast("Devlet adı en az 3 karakter olmalı.","bad");
    S.country=name; S.flag=flag; S.setup=true; S.last=now();
    note("🏛",`${name} kuruldu. Devlet konseyi emirlerinizi bekliyor.`, true);
    closeModal(); Storage.save(S); UI.go("home");
    setTimeout(()=>toast("Hoş geldiniz, sayın lider. İlk göreviniz: bir fabrika kurun."),400);
  };
}

/* ------------------------- 7. Başlat ------------------------- */
function boot(){
  const saved=Storage.load();
  S = saved || newState();
  if(!S.notes) S.notes=[];
  renderNav();
  if(!S.setup){ render(); setupFlow(); }
  else{
    const off=Engine.offline();
    render();
    if(off){
      openModal(`<h2>DEVLET RAPORU</h2><div class="sub">Yokluğunuzda geçen süre: <b>${fmtTime(off.dt*1000)}</b></div>
        <div class="hr"></div>
        <div class="row"><span>Hazine değişimi</span><b style="color:${off.gain>=0?'var(--ok)':'var(--bad)'}">${off.gain>=0?"+":""}${fmt(off.gain)} ₺</b></div>
        <div class="row"><span>Petrol stoğu</span><b>${fmt(S.oil)} varil</b></div>
        <div class="row"><span>Gıda stoğu</span><b>${fmt(S.food)}</b></div>
        <div class="row"><span>Halk mutluluğu</span><b>%${Math.round(S.happy)}</b></div>`);
    }
  }
  S.last=now();

  // Ana döngü: 1 sn
  setInterval(()=>{
    Engine.tick(1);
    S.last=now();
    renderTop();
    if(["tech","army"].includes(UI.current) && (S.research||S.prod.length)) render();
  },1000);
  // Otomatik kayıt
  setInterval(()=>Storage.save(S), 10000);
  window.addEventListener("beforeunload",()=>{ S.last=now(); Storage.save(S); });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){S.last=now();Storage.save(S);} });

  // Rastgele olaylar (dünya canlı hissi)
  setInterval(()=>{
    if(!S.setup) return;
    const evts=[
      ()=>note("📡","Radarınız sınır bölgesinde bilinmeyen hareketlilik tespit etti."),
      ()=>{ const g=Math.floor(1e6+Math.random()*3e6); S.money+=g; note("💰",`Ticaret anlaşmasından ${fmt(g)} ₺ gelir sağlandı.`); },
      ()=>{ const w=WORLD[Math.floor(Math.random()*WORLD.length)]; note("🤝",`${w.n} size ticaret teklifi gönderdi.`); },
      ()=>{ S.oil+=Math.floor(200+Math.random()*600); note("🛢","Yeni rezerv bulundu, petrol üretimi arttı."); },
      ()=>{ S.happy=clamp(S.happy-4,1,100); note("😠","Halk mutluluğu düştü — yaşam maliyeti arttı."); },
      ()=>{ S.rep+=50; note("⭐","Uluslararası zirvedeki performansınız itibarınızı artırdı."); }
    ];
    evts[Math.floor(Math.random()*evts.length)]();
  }, 45000);

  $("#btnSave").onclick=()=>{
    Storage.save(S);
    openModal(`<h2>💾 Kayıt</h2><div class="sub">İlerlemeniz cihazınıza kaydedildi.</div>
      <div class="hr"></div>
      <div class="row"><span>Devlet</span><b>${S.flag} ${S.country}</b></div>
      <div class="row"><span>Oynanış süresi</span><b>${fmtTime(now()-S.created)}</b></div>
      <div class="hr"></div>
      <button class="btn danger full" onclick="if(confirm('Tüm ilerleme silinsin mi?')){localStorage.removeItem('${SAVE_KEY}');location.reload();}">YENİ OYUNA BAŞLA</button>`);
  };
}
boot();
</script>
