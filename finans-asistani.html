<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kişisel Finans Asistanı</title><meta name="theme-color" content="#0f766e"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#1a1d23;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--rd:#dc2626;--or:#d97706;--gr:#16a34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--cd:#1a1f24;--tx:#eef0f2;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2a3138;--rd:#f87171;--or:#fbbf24;--gr:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101316;--cd:#1a1f24;--tx:#eef0f2;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2a3138;--rd:#f87171;--or:#fbbf24;--gr:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
#app{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:16px;margin:0 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.big{display:block;width:100%;padding:18px;margin:10px 0;border:0;border-radius:14px;font-size:18px;font-weight:600;background:var(--ac);color:#fff}
.big.alt{background:var(--cd);color:var(--tx);border:2px solid var(--ac)}
button{font:inherit;cursor:pointer}.b{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600}
.b.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}.b.s{padding:6px 10px;font-size:13px}
input,select{width:100%;padding:11px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:13px;color:var(--mu)}
.amt{font-size:26px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.al{padding:10px 12px;border-radius:10px;margin-bottom:8px;border-left:4px solid var(--ac);background:var(--bg);font-size:14px}
.al.r{border-color:var(--rd)}.al.o{border-color:var(--or)}.al.g{border-color:var(--gr)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:var(--ac)}
.col{display:flex;align-items:flex-end;gap:3px;height:90px;overflow-x:auto;padding-top:6px}.col div{flex:1;min-width:14px;background:var(--ac);border-radius:4px 4px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 2px;color:var(--mu);font-size:11px}nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:18px}
.ex{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.c{box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);border-radius:18px;padding:16px}
.hero{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border:0}.hero .mu{color:#bfe9e3}.hero .amt{font-size:32px;letter-spacing:-.5px}.hero .b.g{color:#fff;border-color:rgba(255,255,255,.4)}
.grade{font-size:24px;font-weight:700;margin-bottom:2px}.bar{height:8px}.b{box-shadow:0 1px 2px rgba(0,0,0,.12)}
body,.amt,.ex{font-variant-numeric:tabular-nums}nav{backdrop-filter:blur(12px);background:color-mix(in srgb,var(--cd) 88%,transparent)}h1{letter-spacing:-.4px}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app>*{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{border-radius:12px;padding:12px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.b{border-radius:12px;padding:11px 16px;transition:transform .1s,opacity .15s}.b:active{transform:scale(.97)}.b.s{padding:7px 11px}
.b:not(.g){background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 90%,#fff),var(--ac))}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f766e,#115e59 55%,#134e4a)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}.hero>*{position:relative;z-index:1}
.al{border-left:0;border-radius:12px;padding:11px 13px;background:color-mix(in srgb,var(--ac) 9%,var(--cd))}
.al.r{background:color-mix(in srgb,var(--rd) 11%,var(--cd))}.al.o{background:color-mix(in srgb,var(--or) 12%,var(--cd))}.al.g{background:color-mix(in srgb,var(--gr) 11%,var(--cd))}
.bar{border-radius:99px}.bar i{border-radius:99px;transition:width .6s}.ex{padding:11px 0}.ex:last-child{border:0}
nav{border-top:0;box-shadow:0 -1px 0 var(--bd),0 -8px 24px rgba(0,0,0,.06)}
nav button{position:relative;padding:10px 0 8px;font-weight:500;transition:color .15s}nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--ac)}
nav span{transition:transform .2s}nav button.on span{transform:scale(1.15)}
svg[width="120"] circle:nth-child(2){animation:ring 1.1s ease-out both}@keyframes ring{from{stroke-dashoffset:330}to{stroke-dashoffset:0}}
.ic{display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;margin-right:8px;font-size:15px;vertical-align:middle}.chip{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.cc{color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.18)}.cbar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin:10px 0 6px;overflow:hidden}.cbar i{display:block;height:100%;background:#fff}
.ft{text-align:center;color:var(--mu);font-size:12.5px;line-height:1.7;margin:22px 0 6px}.ft a{color:var(--ac);text-decoration:none}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:88%;background:#1f2937;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><nav id="nav"></nav>
<script>
const CATS=['Yeme-İçme','Sabit Giderler (Fatura, Kira)','Eğlence','Alışveriş','Ulaşım','Diğer'],CI=['🍽️','🏠','🎬','🛍️','🚌','📦'];
const K='finans_asistani_v1';let S=null,tab='ozet';
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('tr-TR')+' ₺',num=i=>+$(i).value||0;
const today=()=>new Date().toLocaleDateString('sv'),mk=d=>d.slice(0,7);
const work=()=>S.mode==='work',prim=()=>work()?'salary':'allow';
const LB={salary:'Maaş',extra:'Ek Gelir',savings:'Biriktirdiğim Para',allow:'Destek/Harçlık'};
const income=()=>work()?S.salary+S.extra:S.salary;
function setup(){nav.style.display='none';$('app').innerHTML=`<h1>Kişisel Finans Asistanın 👋</h1><p class=mu>Önce durumunu seç:</p><button class="big" onclick="pick('work')">💼 Çalışıyorum</button><button class="big alt" onclick="pick('none')">🎒 Çalışmıyorum</button><div id=sf></div>`}
function pick(m){const w=m==='work';$('sf').innerHTML=`<div class=c><h2>${w?'Gelir bilgilerin':'Destek / Harçlık'}</h2><label>${w?'Maaş (aylık)':'Aylık Destek/Harçlık'}</label><input id=s1 type=number inputmode=decimal><label>${w?'Maaşın yattığı gün (ayın kaçı)':'Yattığı gün (ayın kaçı)'}</label><input id=s2 type=number min=1 max=31 placeholder="örn. 15">${w?'<label>Ek Gelir (aylık)</label><input id=s3 type=number inputmode=decimal><label>Biriktirdiğim Para</label><input id=s4 type=number inputmode=decimal>':''}<button class=b onclick="start('${m}')">Başla</button></div>`}
function start(m){const w=m==='work',sal=num('s1');S={mode:m,salary:sal,payday:Math.min(31,Math.max(1,num('s2')||1)),extra:w?num('s3'):0,bal:w?{salary:sal,extra:num('s3'),savings:num('s4')}:{allow:sal},exp:[],goals:[],cards:[],lastPaid:mk(today()),snooze:''};save();tab='ozet';render()}
const TABS=[['ozet','🏠','Özet'],['gider','💸','Gider'],['rapor','📊','Rapor'],['hedef','🎯','Hedef'],['kart','💳','Kartlar'],['ayar','⚙️','Ayarlar'],['ai','🤖','Asistan']];
function render(){if(!S)return setup();if(S.pin&&!window.UL)return lock();nav.style.display='flex';nav.innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('');$('app').innerHTML=V[tab]()+`<div class=ft><b>Yapımcı: Emre Hoşgören</b><br>İletişim: <a href="mailto:o.emrehosgoren@hotmail.com">o.emrehosgoren@hotmail.com</a></div>`;window.scrollTo(0,0)}
function stats(){const e=S.exp,t=e.reduce((a,x)=>a+x.amt,0);if(!e.length)return{t:0,d:0,w:0,m:0};const f=e.map(x=>x.date).sort()[0],days=Math.max(1,Math.round((new Date(today())-new Date(f))/864e5)+1),ms=new Set(e.map(x=>mk(x.date))).size;return{t,d:t/days,w:t/Math.max(1,days/7),m:t/ms}}
function month(mm){const m=mm||mk(today()),e=S.exp.filter(x=>mk(x.date)===m),by=CATS.map((c,i)=>e.filter(x=>x.cat===i).reduce((a,x)=>a+x.amt,0)),sp=by.reduce((a,b)=>a+b,0),n=new Date(),d=n.getDate(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();return{by,sp,proj:d>=3?sp/d*dim:sp}}
function warns(){const inc=income(),M=month(),W=[];if(!inc)return W;const p=M.sp/inc;
if(p>=1)W.push(['r',`Bu ay gelirinin tamamını (${fmt(M.sp)}) harcadın. Yeni harcamaları durdurmanı öneririm.`]);else if(p>=.8)W.push(['r',`Gelirinin %${Math.round(p*100)}’ini harcadın, ay bitmeden bütçen tükenebilir.`]);
if(p<1&&M.proj>inc)W.push(['o',`Bu hızla ay sonunda yaklaşık ${fmt(M.proj)} harcamış olacaksın, gelirini ${fmt(M.proj-inc)} aşıyor.`]);
const sh=i=>M.by[i]/inc;if(sh(0)>.3)W.push(['o',`Yeme-İçme gelirinin %${Math.round(sh(0)*100)}’i. İdeal seviye %25 civarı; evde yemek bütçeyi rahatlatır.`]);
if(sh(2)+sh(3)>.3)W.push(['o',`Eğlence + Alışveriş gelirinin %${Math.round((sh(2)+sh(3))*100)}’i. Bu ikisini %30’un altında tutmayı dene.`]);
if(sh(1)>.5)W.push(['o',`Sabit giderlerin gelirinin %${Math.round(sh(1)*100)}’i; esneklik payın çok az.`]);
const mp=S.cards.reduce((a,c)=>a+c.min,0);if(mp/inc>.25)W.push(['r',`Kredi kartı asgari ödemelerin gelirinin %${Math.round(mp/inc*100)}’i, çok yüksek.`]);
(S.bud||[]).forEach((b,i)=>{if(b>0&&M.by[i]>=b*.8)W.push([M.by[i]>=b?'r':'o',`${CI[i]} ${CATS[i].split(' (')[0]} bütçesi: ${fmt(M.by[i])} / ${fmt(b)} (%${Math.round(M.by[i]/b*100)})${M.by[i]>=b?' aşıldı!':' dolmak üzere.'}`])});if(!W.length)W.push(['g',M.sp?'Harcamaların kontrol altında, böyle devam 👍':'Henüz bu ay harcama girmedin.']);return W}
const al=W=>W.map(w=>`<div class="al ${w[0]}">${w[1]}</div>`).join('');
const V={
ai(){return`<div class=c><h2>✍️ Doğal Dille Gider</h2><p class=mu>Örn: dün markete 450 harcadım</p><input id=nl><button class=b onclick="nl()">Ekle</button></div><div class=c><h2>🧾 Fiş Fotoğrafı</h2><input id=fi type=file accept="image/*" onchange="rc(this.files[0])"></div><div class="al g" id=ao style="display:none"></div><div class=c><h2>💬 Asistanla Sohbet</h2><textarea id=cq style="width:100%;height:70px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px" placeholder="Bu ay neden bütçeyi aştım?"></textarea><div class=row style="margin:8px 0;flex-wrap:wrap"><button class=b onclick="chat()">Sor</button><button class="b g s" onclick="chatQ('Bu ayın finansal durumunu geçen aya göre yorumla, en çok artan kategoriyi ve puanımı yükseltmek için 3 somut adım yaz.')">📆 Aylık yorum</button><button class="b g s" onclick="chatQ('Hedeflerim için aylık ne kadar ayırmalıyım?')">🎯 Hedef önerisi</button></div><div id=co style="white-space:pre-wrap;font-size:14px"></div></div>`},
ayar(){return`<div class=c><h2>Gelir Ayarları</h2><label>${work()?'Maaş':'Harçlık'} (aylık)</label><input id=a1 type=number value="${S.salary}"><label>Yattığı gün</label><input id=a2 type=number min=1 max=31 value="${S.payday}">${work()?`<label>Ek gelir (aylık)</label><input id=a3 type=number value="${S.extra}">`:''}<label>Yıllık enflasyon beklentisi (%)</label><input id=a4 type=number value="${S.infl??40}"><button class=b onclick="saveSet()">Kaydet</button></div>
<div class=c><h2>Kategori Bütçeleri (aylık)</h2>${CATS.map((c,i)=>`<label>${CI[i]} ${c.split(' (')[0]}</label><input id=b${i} type=number value="${(S.bud||[])[i]||''}" placeholder="limit yok">`).join('')}<button class=b onclick="saveBud()">Kaydet</button></div>
<div class=c><h2>Tekrarlayan Giderler</h2>${(S.rec||[]).map((r,i)=>`<div class=ex><span>${esc(r.name)} <span class=mu>· her ayın ${r.day}’i · ${CI[r.cat]}</span></span><span>${fmt(r.amt)} <button class="b g s" onclick="S.rec.splice(${i},1);save();render()">✕</button></span></div>`).join('')}<label>Ad (örn. Kira)</label><input id=r1><label>Tutar</label><input id=r2 type=number><label>Ayın kaçı</label><input id=r3 type=number min=1 max=28><label>Kategori</label><select id=r4>${CATS.map((c,i)=>`<option value=${i}>${c}</option>`).join('')}</select><label>Kaynak</label><select id=r5>${Object.keys(S.bal).map(k=>`<option value=${k}>${LB[k]}</option>`).join('')}</select><button class=b onclick="addRec()">Ekle</button></div>
<div class=c><h2>Taksitler</h2>${(S.inst||[]).map((t,i)=>`<div class=ex><span>${esc(t.name)}<br><span class=mu>${t.left} ay kaldı · toplam ${fmt(t.amt*t.left)}</span></span><span>${fmt(t.amt)}/ay <button class="b s" onclick="S.inst[${i}].left--;if(S.inst[${i}].left<=0)S.inst.splice(${i},1);save();render()">Ödendi</button></span></div>`).join('')}<label>Ad</label><input id=t1><label>Aylık taksit</label><input id=t2 type=number><label>Kalan ay</label><input id=t3 type=number><button class=b onclick="addInst()">Ekle</button></div>
<div class=c><h2>Varlıklar (altın, döviz, yatırım)</h2>${(S.assets||[]).map((a,i)=>`<div class=ex><span>${esc(a.name)}</span><span>${fmt(a.val)} <button class="b g s" onclick="S.assets.splice(${i},1);save();render()">✕</button></span></div>`).join('')}<label>Ad</label><input id=v1><label>Değer (₺)</label><input id=v2 type=number><button class=b onclick="addAsset()">Ekle</button></div>
<div class=c><h2>Dışa Aktar</h2><button class=b onclick="csv()">Giderleri CSV indir</button></div>
<div class=c><h2>Güvenlik ve Görünüm</h2><label>PIN (4–6 rakam, boş = kapalı)</label><input id=p1 type=password inputmode=numeric maxlength=6 value="${S.pin||''}"><div class=row><button class=b onclick="S.pin=$('p1').value||'';save();alert('Kaydedildi')">PIN Kaydet</button><button class="b g" onclick="S.theme=({dark:'light',light:'dark'})[document.documentElement.dataset.theme]||'dark';document.documentElement.dataset.theme=S.theme;save()">🌓 Tema</button></div></div>
<div class=c><h2>Yedekle / Geri Yükle</h2><p class=mu>Yedeği kopyalayıp güvenli bir yere yapıştır. Geri yüklemek için kutuya yapıştırıp bas.</p><textarea id=bk style="width:100%;height:80px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px"></textarea><div class=row style="margin-top:8px"><button class=b onclick="$('bk').value=JSON.stringify(S);$('bk').select();try{navigator.clipboard.writeText($('bk').value)}catch(e){}">Yedeği Al</button><button class="b g" onclick="try{S=JSON.parse($('bk').value);save();render()}catch(e){alert('Geçersiz yedek')}">Geri Yükle</button></div></div>
<button class="b g s" onclick="if(confirm('Tüm veriler silinsin mi?')){S=null;save();render()}">Sıfırla</button>`},
ozet(){const b=S.bal,tot=Object.keys(b).filter(k=>k!=='savings').reduce((a,k)=>a+b[k],0),n=new Date(),show=S.payday&&S.lastPaid!==mk(today())&&n.getDate()>=S.payday&&S.snooze!==today();
return`<div style="margin:2px 0 14px"><div class="row sp"><div><div class=mu>${new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</div><h1 style="margin:0">${greet()} 👋</h1></div><button class="b g s" onclick="tgT()">🌓</button></div></div>${show?`<div class=c style="border-color:var(--ac)"><h2>💰 ${work()?'Maaşın':'Harçlığın'} yattı mı?</h2><p class=mu>Evet dersen ${fmt(S.salary)} ${LB[prim()]} bakiyene eklenecek (devreden ${fmt(S.bal[prim()])} + ${fmt(S.salary)} = ${fmt(S.bal[prim()]+S.salary)}).</p><div class=row><button class=b onclick="paid()">Evet, yattı</button><button class="b g" onclick="S.snooze=today();save();render()">Henüz değil</button></div></div>`:''}
<div class="c hero"><div class=mu>Harcanabilir bakiye</div><div class=amt>${fmt(tot)}</div>${b.savings!=null?`<div class=mu>Birikim ayrı tutulur: ${fmt(b.savings)}</div>`:''}<div class=row style="margin-top:14px"><button class="b g s" onclick="tab='gider';render()">＋ Gider ekle</button><button class="b g s" onclick="tab='ai';render()">✨ Hızlı ekle</button></div><div class=grid style="margin-top:10px">${Object.keys(b).map(k=>`<div><div class=mu>${LB[k]}</div><b>${fmt(b[k])}</b></div>`).join('')}</div>
<div class=mu style="margin-top:10px">${work()?'Maaş':'Harçlık'}: ${fmt(S.salary)} · Yatış günü: ayın ${S.payday}’i</div>${work()?'<button class="b g s" style="margin-top:8px" onclick="addExtra()">+ Ek gelir ekle</button>':''}</div>
${S.tour?'':tour()}${upc()}${scoreCard()}<div class=c><h2>🧠 Asistan Önerileri</h2>${al(warns())}</div>
<button class="b g s" onclick="if(confirm('Tüm veriler silinsin mi?')){S=null;save();render()}">Sıfırla</button>`},
gider(){const opt=Object.keys(S.bal).map(k=>`<option value="${k}">${LB[k]}</option>`).join('')+S.cards.map(c=>`<option value="card:${c.id}">💳 ${esc(c.name)}</option>`).join('');
const days={};S.exp.filter(x=>!GF||((x.note||'')+CATS[x.cat]).toLowerCase().includes(GF)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).forEach(x=>(days[x.date]=days[x.date]||[]).push(x));
return`${wk()}<div class=c><h2>Gider Ekle</h2><label>Tutar</label><input id=g1 type=number inputmode=decimal><label>Kategori</label><select id=g2>${CATS.map((c,i)=>`<option value=${i}>${CI[i]} ${c}</option>`).join('')}</select><label>Hangisinden harcadın?</label><select id=g3>${opt}</select><label>Tarih</label><input id=g4 type=date value="${today()}"><label>Not (isteğe bağlı)</label><input id=g5><button class=b onclick="addExp()">Ekle</button></div>

async function csv(){const d=window.claude?await claude.use('downloads'):null;if(!d)return alert('İndirme bu görünümde yok. Yedek Al’ı kullan.');const r=['Tarih;Kategori;Tutar;Kaynak;Not'].concat([...S.exp].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,CATS[x.cat],x.amt,x.src.startsWith('card:')?'Kart':LB[x.src],(x.note||'').replace(/;/g,',')].join(';')));try{await d.save({filename:'giderler.csv',data:'\ufeff'+r.join('\n')})}catch(e){}}
function tour(){return`<div class=c style="border-color:var(--ac)"><h2>👋 Hoş geldin</h2><p class=mu>Özet: bakiye ve puan · Gider: günlük kayıt · Rapor: grafikler · Hedef: birikim planı · Kartlar: borç planı · Ayarlar: bütçe, taksit, yedek · Asistan: yapay zekâ ile gider ekle ve soru sor.</p><button class=b onclick="S.tour=1;save();render()">Anladım</button></div>`}
function nwCard(){const v=Object.values(S.bal).reduce((a,x)=>a+x,0)+(S.assets||[]).reduce((a,x)=>a+x.val,0)-S.cards.reduce((a,c)=>a+c.debt,0)-(S.inst||[]).reduce((a,t)=>a+t.amt*t.left,0);S.nw=S.nw||{};S.nw[mk(today())]=v;save();const k=Object.keys(S.nw).sort().slice(-6),mx=Math.max(1,...k.map(x=>Math.abs(S.nw[x]))),h=Object.keys(S.hist||{}).sort().slice(-6);return`<div class=c><h2>Net Değer</h2><div class=amt style="color:${v>=0?'var(--gr)':'var(--rd)'}">${fmt(v)}</div><div class=mu>Bakiyeler + varlıklar − kart borcu − taksitler</div><div class=col>${k.map(x=>`<div title="${x}: ${fmt(S.nw[x])}" style="height:${Math.max(3,Math.abs(S.nw[x])/mx*100)}%;${S.nw[x]<0?'background:var(--rd)':''}"></div>`).join('')}</div><h2 style="margin-top:14px">Puan Geçmişi</h2><div class=col>${h.map(x=>`<div title="${x}: ${S.hist[x]}" style="height:${Math.max(3,S.hist[x])}%"></div>`).join('')}</div></div>`}
function pstart(){const n=new Date(),P=S.payday||1,dim=(y,m)=>new Date(y,m+1,0).getDate();let y=n.getFullYear(),m=n.getMonth();if(n.getDate()<Math.min(P,dim(y,m))){m--;if(m<0){m=11;y--}}return new Date(y,m,Math.min(P,dim(y,m))).toLocaleDateString('sv')}
function old(x){return x.src===prim()&&x.date<pstart()}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(window._tt);window._tt=setTimeout(()=>{t.className=''},3200)}
window.alert=toast;
function greet(){const h=new Date().getHours();return h<5?'İyi geceler':h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar'}
function tgT(){const e=document.documentElement,c=e.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.theme=c==='dark'?'light':'dark';e.dataset.theme=S.theme;save()}
const CC=[['#4f46e5','#7c3aed'],['#0f766e','#0e7490'],['#be123c','#9d174d'],['#1f2937','#374151']];
function wk(){const n=new Date(),f=o=>{const d=new Date(n);d.setDate(d.getDate()-o);return d.toLocaleDateString('sv')},a=f(6),b=f(13),c=f(7),cur=S.exp.filter(x=>x.date>=a),prv=S.exp.filter(x=>x.date>=b&&x.date<=c),t=cur.reduce((s,x)=>s+x.amt,0),p=prv.reduce((s,x)=>s+x.amt,0),by=CATS.map((_,i)=>cur.filter(x=>x.cat===i).reduce((s,x)=>s+x.amt,0)),dl=p?Math.round((t-p)/p*100):null;return`<div class=c><div class=mu>Son 7 gün</div><div class="row sp"><span class=amt>${fmt(t)}</span>${dl!=null?`<span class=chip style="color:${dl>0?'var(--rd)':'var(--gr)'};background:var(--bg)">${dl>0?'▲':'▼'} %${Math.abs(dl)}</span>`:''}</div><div class=mu>Günlük ortalama ${fmt(t/7)}${dl!=null?' · önceki haftaya göre':''}</div><div style="margin-top:10px">${by.map((v,i)=>v?`<span class=chip style="background:color-mix(in srgb,${COL[i]} 16%,transparent)">${CI[i]} ${fmt(v)}</span>`:'').join('')}</div></div>`}
function addExtra(){const v=+prompt('Ek gelir tutarı:');if(v>0){S.bal.extra+=v;save();render()}}
function addExp(){const a=num('g1');if(a<=0)return;const x={id:Date.now(),amt:a,cat:+$('g2').value,src:$('g3').value,date:$('g4').value||today(),note:$('g5').value.trim()};x.nb=old(x);S.exp.push(x);if(x.src.startsWith('card:')){const c=S.cards.find(c=>'card:'+c.id===x.src);if(c)c.debt+=a}else if(!x.nb)S.bal[x.src]-=a;save();render();if(x.nb)alert(`Bu harcama önceki maaş dönemine (${pstart()} öncesi) ait olduğu için güncel bakiyenden düşülmedi. Raporlarda yine görünür.`)}
function delExp(id){const x=S.exp.find(x=>x.id===id);if(!x)return;if(x.src.startsWith('card:')){const c=S.cards.find(c=>'card:'+c.id===x.src);if(c)c.debt-=x.amt}else if(x.src in S.bal&&!x.nb)S.bal[x.src]+=x.amt;S.exp=S.exp.filter(y=>y.id!==id);save();render()}
function addGoal(){const t=num('h2');if(!$('h1').value.trim()||t<=0)return;S.goals.push({name:$('h1').value.trim(),target:t,saved:num('h3')});save();render()}
function addSaved(i){const v=+prompt('Eklenecek birikim:');if(v>0){S.goals[i].saved+=v;save();render()}}
function addCard(){if(!$('k1').value.trim())return;S.cards.push({id:Date.now(),name:$('k1').value.trim(),debt:num('k2'),min:num('k3'),limit:num('k5'),rate:num('k6'),due:Math.min(31,num('k4')||0),pm:{}});save();render()}
function payCard(i){const v=+prompt('Ödeme tutarı ('+LB[prim()]+' bakiyenden düşer):');if(v>0){const c=S.cards[i];c.debt=Math.max(0,c.debt-v);const pm=mk(today());c.pm=c.pm||{};c.pm[pm]=(c.pm[pm]||0)+v;S.bal[prim()]-=v;save();render()}}
if(S){if(S.theme)document.documentElement.dataset.theme=S.theme;procRec()}
render();
</script></body></html>
